<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 456" role="img" aria-label="Method data flow: documents are chunked into a short-term chunk store; cycle 0 extracts an entity graph of text cards; each dream cycle reads evidence chunks and rewrites cards; the forgetting rule turns chunks read into forgotten (withheld) chunks; each snapshot answers questions from 20 cards and 10 remembered chunks, scored for recall against gold facts, and plotted against memory as a forgetting curve." font-family="Inter, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:#16152b"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:#c2541f"/></marker></defs><rect x="210" y="38" width="180" height="406" rx="12" style="fill:none;stroke:#4c4a66" stroke-width="1" stroke-dasharray="2 4"/><text x="300" y="438" text-anchor="middle" font-size="11" style="fill:#4c4a66">memory = searchable characters</text><rect x="20" y="50" width="140" height="64" rx="8" style="fill:#ffffff;stroke:#16152b" stroke-width="1.2"/><text x="90.0" y="77" text-anchor="middle" font-size="14" font-weight="600" style="fill:#16152b">Documents</text><text x="90.0" y="97" text-anchor="middle" font-size="11.5" style="fill:#4c4a66">first 10% of each</text><rect x="220" y="50" width="160" height="64" rx="8" style="fill:#ffffff;stroke:#16152b" stroke-width="1.2"/><text x="300.0" y="77" text-anchor="middle" font-size="14" font-weight="600" style="fill:#16152b">Chunk store</text><text x="300.0" y="97" text-anchor="middle" font-size="11.5" style="fill:#4c4a66">short-term · BM25 + dense</text><rect x="220" y="350" width="160" height="64" rx="8" style="fill:#ffffff;stroke:#16152b" stroke-width="1.2"/><text x="300.0" y="377" text-anchor="middle" font-size="14" font-weight="600" style="fill:#16152b">Entity graph</text><text x="300.0" y="397" text-anchor="middle" font-size="11.5" style="fill:#4c4a66">long-term · text cards</text><rect x="460" y="50" width="160" height="64" rx="8" style="fill:#ffffff;stroke:#c2541f" stroke-width="1.6"/><text x="540.0" y="77" text-anchor="middle" font-size="14" font-weight="600" style="fill:#16152b">Forgetting rule</text><text x="540.0" y="97" text-anchor="middle" font-size="11.5" style="fill:#4c4a66">chunk · probe · entity</text><rect x="460" y="200" width="160" height="64" rx="8" style="fill:#ffffff;stroke:#16152b" stroke-width="1.2"/><text x="540.0" y="227" text-anchor="middle" font-size="14" font-weight="600" style="fill:#16152b">Dream cycle</text><text x="540.0" y="247" text-anchor="middle" font-size="11.5" style="fill:#4c4a66">40k tokens · ×16</text><rect x="680" y="50" width="160" height="64" rx="8" style="fill:#ffffff;stroke:#16152b" stroke-width="1.2"/><text x="760.0" y="77" text-anchor="middle" font-size="14" font-weight="600" style="fill:#16152b">Retrieve</text><text x="760.0" y="97" text-anchor="middle" font-size="11.5" style="fill:#4c4a66">20 cards + 10 chunks</text><rect x="680" y="200" width="160" height="64" rx="8" style="fill:#ffffff;stroke:#16152b" stroke-width="1.2"/><text x="760.0" y="227" text-anchor="middle" font-size="14" font-weight="600" style="fill:#16152b">Answer</text><text x="760.0" y="247" text-anchor="middle" font-size="11.5" style="fill:#4c4a66">llama3.1:8b · temp 0</text><rect x="680" y="350" width="160" height="64" rx="8" style="fill:#ffffff;stroke:#16152b" stroke-width="1.2"/><text x="760.0" y="377" text-anchor="middle" font-size="14" font-weight="600" style="fill:#16152b">Recall</text><text x="760.0" y="397" text-anchor="middle" font-size="11.5" style="fill:#4c4a66">NLI vs gold facts</text><rect x="880" y="200" width="130" height="64" rx="8" style="fill:#ffffff;stroke:#16152b" stroke-width="1.2"/><text x="945.0" y="227" text-anchor="middle" font-size="14" font-weight="600" style="fill:#16152b">Forgetting curve</text><text x="945.0" y="247" text-anchor="middle" font-size="11.5" style="fill:#4c4a66">memory ↓ vs recall ↓</text><path d="M160,82 L216,82" style="fill:none;stroke:#16152b" stroke-width="1.2" marker-end="url(#arr)"/><text x="188" y="74" text-anchor="middle" font-size="11.5" style="fill:#4c4a66">chunk</text><path d="M250,114 L250,346" style="fill:none;stroke:#16152b" stroke-width="1.2" marker-end="url(#arr)"/><text x="258" y="226" text-anchor="start" font-size="11.5" style="fill:#4c4a66">cycle 0:</text><text x="258" y="241" text-anchor="start" font-size="11.5" style="fill:#4c4a66">extract</text><path d="M330,114 L330,232 L456,232" style="fill:none;stroke:#16152b" stroke-width="1.2" marker-end="url(#arr)"/><text x="384" y="225" text-anchor="end" font-size="11.5" style="fill:#4c4a66">evidence</text><text x="452" y="250" text-anchor="end" font-size="10.5" style="fill:#c2541f">F: minus</text><text x="452" y="264" text-anchor="end" font-size="10.5" style="fill:#c2541f">forgotten</text><path d="M540,264 L540,382 L384,382" style="fill:none;stroke:#16152b" stroke-width="1.2" marker-end="url(#arr)"/><text x="462" y="375" text-anchor="middle" font-size="11.5" style="fill:#4c4a66">rewrites cards</text><path d="M540,200 L540,118" style="fill:none;stroke:#16152b" stroke-width="1.2" marker-end="url(#arr)"/><text x="548" y="162" text-anchor="start" font-size="11.5" style="fill:#4c4a66">chunks read</text><path d="M460,82 L384,82" style="fill:none;stroke:#c2541f" stroke-width="1.8" marker-end="url(#arrA)"/><text x="424" y="74" text-anchor="middle" font-size="10.5" style="fill:#c2541f">forgets</text><path d="M300,50 L300,24 L760,24 L760,46" style="fill:none;stroke:#16152b" stroke-width="1.2" marker-end="url(#arr)"/><text x="580" y="18" text-anchor="middle" font-size="11.5" style="fill:#4c4a66">remembered chunks</text><path d="M380,398 L660,398 L660,82 L676,82" style="fill:none;stroke:#16152b" stroke-width="1.2" marker-end="url(#arr)"/><text x="625" y="392" text-ancho