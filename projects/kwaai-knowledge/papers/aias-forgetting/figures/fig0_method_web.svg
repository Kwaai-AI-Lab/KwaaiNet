<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 456" role="img" aria-label="Method data flow: documents are chunked into a short-term chunk store; cycle 0 extracts an entity graph of text cards; each dream cycle reads evidence chunks and rewrites cards; the forgetting rule turns chunks read into forgotten (withheld) chunks; each snapshot answers questions from 20 cards and 10 remembered chunks, scored for recall against gold facts, and plotted against memory as a forgetting curve." font-family="Inter, Helvetica, Arial, sans-serif" style="max-width:100%;height:auto;display:block"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:currentColor"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--cliff)"/></marker></defs><rect x="210" y="38" width="180" height="406" rx="12" style="fill:none;stroke:var(--ink-2)" stroke-width="1" stroke-dasharray="2 4"/><text x="300" y="438" text-anchor="middle" font-size="11" style="fill:var(--ink-2)">memory = searchable characters</text><rect x="20" y="50" width="140" height="64" rx="8" style="fill:var(--surface);stroke:currentColor" stroke-width="1.2"/><text x="90.0" y="77" text-anchor="middle" font-size="14" font-weight="600" style="fill:currentColor">Documents</text><text x="90.0" y="97" text-anchor="middle" font-size="11.5" style="fill:var(--ink-2)">first 10% of each</text><rect x="220" y="50" width="160" height="64" rx="8" style="fill:var(--surface);stroke:currentColor" stroke-width="1.2"/><text x="300.0" y="77" text-anchor="middle" font-size="14" font-weight="600" style="fill:currentColor">Chunk store</text><text x="300.0" y="97" text-anchor="middle" font-size="11.5" style="fill:var(--ink-2)">short-term · BM25 + dense</text><rect x="220" y="350" width="160" height="64" rx="8" style="fill:var(--surface);stroke:currentC