[package]
name = "kwaai-provenance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Native provenance primitives for KwaaiNet knowledge: claim/evidence identity, lineage log, policy gate, and JSONL persistence"

[dependencies]
serde = { workspace = true }
