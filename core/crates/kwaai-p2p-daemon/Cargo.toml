[package]
name = "kwaai-p2p-daemon"
version = "0.6.8"
edition = "2021"
authors = ["KwaaiNet Contributors"]
description = "The p2pd control-socket protocol: client and node-hosted server"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["net", "io-util", "sync", "rt", "macros", "time"] }
# `compat` bridges libp2p's `futures::io` streams onto tokio's traits, so pipe
# mode can relay both ends with a single `tokio::io::copy_bidirectional`.
tokio-util = { version = "0.7", features = ["compat"] }
prost = "0.13"
futures = "0.3"
tracing = "0.1"
thiserror = "1.0"
async-trait = "0.1"
bytes = "1.5"
unsigned-varint = { version = "0.8", features = ["codec"] }
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
# Only used for multiaddr parsing/encoding (not for actual p2p networking)
libp2p = { workspace = true }

# The control-socket *server* (`server.rs`) translates the p2pd protocol into
# NetworkHandle calls. The client half of this crate has no such dependency —
# it talks to whatever serves the socket, Go daemon or native node alike.
kwaai-p2p = { workspace = true }

# Windows named pipe support
[target.'cfg(windows)'.dependencies]
tokio = { version = "1.35", features = ["net", "io-util"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tokio-test = "0.4"
env_logger = "0.11"
# tests/control_server.rs drives the real P2PClient against a ControlServer
# backed by a real NetworkService.
tempfile = "3"
