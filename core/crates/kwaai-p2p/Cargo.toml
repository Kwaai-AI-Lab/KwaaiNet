[package]
name = "kwaai-p2p"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "P2P networking layer for KwaaiNet - in-process rust-libp2p swarm"
keywords = ["p2p", "dht", "kademlia", "networking", "decentralized"]

[dependencies]
# Async
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# P2P
libp2p = { workspace = true }
kwaai-hivemind-dht = { workspace = true }  # hivemind unary wire codec
uuid = { workspace = true }                # 16-byte call IDs on the unary wire

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { workspace = true }
tempfile = "3"

[features]
default = ["tcp"]
tcp = []
