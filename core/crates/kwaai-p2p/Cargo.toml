[package]
name = "kwaai-p2p"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "P2P networking layer for KwaaiNet - in-process rust-libp2p swarm"
keywords = ["p2p", "dht", "kademlia", "networking", "decentralized"]

[dependencies]
# Async
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# P2P
libp2p = { workspace = true }
kwaai-hivemind-dht = { workspace = true }  # hivemind unary wire codec
uuid = { workspace = true }                # 16-byte call IDs on the unary wire
prost = { workspace = true }               # DHT request/response encode/decode

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { workspace = true }
tempfile = "3"
rmp-serde = { workspace = true }  # msgpack subkeys in the DHT service tests
serde_yaml = { workspace = true } # the `ipv6` config key is written as YAML
rmpv = "1.0"                      # msgpack record values in the live DHT test
sha1 = "0.10"                     # DHTID derivation in the live DHT test

[features]
default = ["tcp", "ipv6"]
tcp = []
# Listen on and dial IPv6. On by default; off strips the v6 listeners and makes
# the `ipv6` config key read as `false` whatever it says.
ipv6 = []
# Serve /ipfs/kad/1.0.0 alongside /kwaai/kad/1.0.0 — the bootstrap-grade build
# for the migration window. Needs the patched libp2p-kad in [patch.crates-io]
# (patches/libp2p-kad.patch restores `set_protocol_names`, removed upstream in
# 0.47), so it is OFF by default: the published crate carries no patch and must
# still compile. See `kad_protocols()` in src/config.rs.
kad-multi-protocol = []
