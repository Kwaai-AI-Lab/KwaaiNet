// kwaai-rpc — gRPC surface for the long-running `kwaainet start` daemon.
//
// This service is hosted in-process by the kwaainet (kwaai-cli) binary and
// is the integration point for the Flutter GUI and any future CLI
// subcommands that want structured (non-stdout) access to the daemon.
//
// Wire compatibility: only ever append new fields and use explicit field
// numbers. Don't renumber existing fields or repurpose tags.

syntax = "proto3";

package kwaai.v1;

service KwaaiNet {
    // Multiplexed bidi session. The client opens Session once per
    // connection and sends a stream of ClientFrames; the server emits a
    // stream of ServerFrames in response. Each frame carries a client-
    // assigned `id` correlating requests with their responses, so many
    // long-running operations (generate, shard_run, status) can
    // interleave on a single channel without needing one rpc per
    // operation type.
    //
    // The first frame on a new id opens a logical operation. Subsequent
    // frames with that id either continue input to it (future multi-turn)
    // or cancel it (a `Cancel` body). The server emits zero or more reply
    // frames for the id, terminating with a `Done` or `Error` body —
    // both signal the operation is finished and the id may be reused.
    //
    // This is the canonical surface; the legacy Chat / Ping rpcs below
    // remain for a deprecation cycle.
    rpc Session(stream ClientFrame) returns (stream ServerFrame);

    // -----------------------------------------------------------------
    // Legacy rpcs (pre-Session). Kept until all callers migrate. Don't
    // add new functionality here — use Session.
    // -----------------------------------------------------------------
    rpc Chat(stream ChatMessage) returns (stream ChatToken);
    rpc Ping(PingRequest) returns (PingReply);
}

// =====================================================================
// Session envelope types
// =====================================================================

// Frame sent from client → server on the Session stream. The `body`
// oneof selects which operation type this frame drives. Operation
// names match the CLI subcommand they correspond to, dot-to-camelcase:
//
//   ping              ←  (no CLI equivalent; gRPC-only liveness probe)
//   generate          ←  `kwaainet generate <PROMPT>`
//   shardRun          ←  `kwaainet shard run <PROMPT>`
//   status            ←  `kwaainet status`
//   cancel            ←  (no CLI equivalent; aborts an in-flight op)
//   blockCoverage     ←  `kwaainet shard chain`
//
// New operations are added as siblings here; preserving the flat shape
// keeps the dispatch trivial on both sides.
message ClientFrame {
    // Operation correlation id. Pick any non-zero value unused by an
    // active operation on this Session. Reuse after Done/Error.
    uint64 id = 1;

    oneof body {
        PingRequest ping = 10;

        // Single-node inference using the local InferenceEngine. The
        // node must have the model loaded locally — most useful for
        // dev / fallback when the shard mesh isn't ready.
        GenerateRequest generate = 11;

        // Distributed inference across the shard mesh. Routes blocks
        // to peer nodes via the existing block_rpc layer. This is the
        // default chat path for the GUI.
        ShardRunRequest shard_run = 12;

        // Snapshot of node status (uptime, peers, model state). One
        // ServerFrame.status reply, then Done.
        StatusRequest status = 13;

        // Cancel an in-flight operation by id.
        Cancel cancel = 14;

        // --- RAG ops (tags 20-25, owned by feat/grpc-rag) ---
        //
        // Tags 15-19 are claimed by other in-flight branches
        // (grpc-shards 15, grpc-vpk 16, grpc-peers 17-18,
        // inference-events 19), so this branch starts at 20 and keeps
        // the ClientFrame / ServerFrame numbering aligned.

        // Snapshot of every configured knowledge base. One
        // ServerFrame.rag_status reply, then Done. An empty kbs list
        // means "RAG is compiled in but nothing is initialised"; a
        // build without the `rag` feature answers UNIMPLEMENTED
        // instead, so the client can tell the two apart.
        RagStatusRequest rag_status = 20;

        // Create (or idempotently re-create) a knowledge base. Probes
        // the embedding model for its dimension, so it fails with
        // UNAVAILABLE when Ollama isn't reachable.
        RagInitRequest rag_init = 21;

        // Ingest one document, whose bytes follow as rag_ingest_data
        // frames under this op's id. Emits ServerFrame.rag_progress
        // frames before the terminal rag_ingest reply. Reusing the id
        // of an op still in flight fails with INVALID_ARGUMENT.
        // Cancellable. A cancel, or the session closing, mid-upload ends
        // the ingest; one that fails or is cancelled after storing
        // vectors removes them again (best-effort).
        RagIngestRequest rag_ingest = 22;

        // One piece of an ingest's document, sent in order with
        // ClientFrame.id set to that ingest's id. Acknowledged by a
        // RAG_PHASE_RECEIVING progress frame; see RagIngestData.
        RagIngestData rag_ingest_data = 24;

        // Retrieve chunks for a query. One ServerFrame.rag_query reply,
        // then Done.
        RagQueryRequest rag_query = 23;


        // Block-coverage snapshot / subscription. One-shot when
        // `subscribe` is false (one BlockCoverageUpdate reply, then
        // Done); a live feed when true (a BlockCoverageUpdate every
        // refresh interval until cancelled with a `Cancel` body).
        BlockCoverageRequest block_coverage = 15;
        // Local p2p state: connections, DHT routing table and this
        // node's own reachability. Unlike the two above it queries no
        // DHT — it reads the swarm — so it is cheap enough to poll at a
        // few seconds. Reachability changes push out of band rather than
        // waiting for the next tick; see NetworkUpdate.reason.
        NetworkRequest network = 17;

        // Dial a peer by id. One ConnectReply, then Done.
        ConnectRequest connect = 18;



        // VPK storage-node discovery. Like block_coverage, but for the
        // `_kwaai.vpk.nodes` DHT registry. Note that a one-shot request
        // yields *two* StorageUpdate replies before Done — see
        // StorageUpdate.probes_pending.
        StorageDiscoveryRequest storage_discovery = 16;

        // Remove one document and every chunk it contributed. One
        // ServerFrame.rag_delete reply, then Done. Deleting a document
        // the KB doesn't hold is NOT_FOUND rather than a silent no-op,
        // so a stale UI row doesn't read as a successful delete.
        RagDeleteRequest rag_delete = 25;

        // Hivemind DHT records this node holds locally. One
        // DhtRecordsReply, then Done. Reads the local store only — see
        // DhtRecordsRequest for why there is no network-wide listing.
        DhtRecordsRequest dht_records = 26;

        // Resolve one known key across the network. One DhtLookupReply,
        // then Done.
        DhtLookupRequest dht_lookup = 27;
    }
}

// Frame sent from server → client on the Session stream. The `id`
// matches the originating ClientFrame.id, so the client can dispatch
// frames to whichever caller is awaiting them.
message ServerFrame {
    uint64 id = 1;

    oneof body {
        PingReply pong = 10;

        // Mid-stream token from generate / shard_run. Multiple tokens
        // arrive for one id before the operation ends.
        ChatToken token = 11;

        // Operation completed cleanly. Always the last frame for a
        // given id on success. After Done the id is free to reuse.
        Done done = 12;

        // Operation failed. Mutually exclusive with Done; same
        // semantics (operation is over, id is free).
        Error error = 13;

        // Reply to a StatusRequest.
        StatusReply status = 14;

        // --- RAG replies (tags 20-25, owned by feat/grpc-rag) ---
        // Tags do not pair with ClientFrame's: rag_ingest's reply is 24
        // and its progress 22. Match replies by id, never by tag.

        // Reply to RagStatusRequest.
        RagStatusUpdate rag_status = 20;

        // Reply to RagInitRequest.
        RagInitReply rag_init = 21;

        // Mid-operation progress for rag_ingest. Zero or more of these
        // precede the terminal rag_ingest reply; a client that ignores
        // them still gets a correct result.
        RagProgress rag_progress = 22;

        // Reply to RagQueryRequest.
        RagQueryReply rag_query = 23;

        // Terminal reply to RagIngestRequest.
        RagIngestReply rag_ingest = 24;


        // Snapshot of model block coverage. Exactly one arrives for a
        // one-shot BlockCoverageRequest; a subscription delivers one
        // per refresh interval until the op is cancelled.
        BlockCoverageUpdate block_coverage = 15;
        // Snapshot of local p2p state. One arrives for a one-shot
        // NetworkRequest; a subscription delivers one per refresh
        // interval, plus one immediately whenever reachability changes.
        NetworkUpdate network = 17;

        // Reply to a ConnectRequest.
        ConnectReply connect = 18;



        // Snapshot of discovered VPK storage nodes. Arrives in pairs
        // per discovery round: one with probes_pending set, then one
        // with reachability resolved.
        StorageUpdate storage = 16;

        // Structured progress event for a shard_run operation, emitted
        // only when ShardRunRequest.events was set. Interleaved with
        // `token` bodies on the same id, and never terminal — the
        // operation still ends with Done or Error.
        InferenceEvent inference_event = 19;

        // Reply to RagDeleteRequest.
        RagDeleteReply rag_delete = 25;

        // Reply to a DhtRecordsRequest.
        DhtRecordsReply dht_records = 26;

        // Reply to a DhtLookupRequest.
        DhtLookupReply dht_lookup = 27;
    }
}

// Sent from client → server to abort an in-flight operation by id.
message Cancel {
    // The operation id (not the Cancel frame's own id) to abort. The
    // server emits an Error{code=CANCELLED} for `target_id` and the
    // operation winds down.
    uint64 target_id = 1;
}

// Generic terminator for a successful operation. Reserved tag range
// 1-15 left for future per-op summary data.
message Done {
}

// Generic operation-level failure. Distinct from grpc transport errors
// (which surface as the rpc's own Status) — these are application-level
// failures inside an otherwise-healthy Session.
message Error {
    enum Code {
        UNKNOWN = 0;
        INVALID_ARGUMENT = 1;
        NOT_FOUND = 2;
        UNAVAILABLE = 3;
        CANCELLED = 4;
        INTERNAL = 5;
        UNIMPLEMENTED = 6;

        // Inference-specific failure classes. Promoted out of INTERNAL
        // so clients can render a friendly message without grepping
        // the human-readable `message` field.

        // The DHT had no peers serving this model at all. Often
        // transient at startup before discovery completes; sometimes
        // permanent if the model isn't being served by anyone on the
        // network.
        NO_PEERS_FOR_MODEL = 7;

        // Peers exist but they don't collectively cover every block
        // of the model — the dispatcher can't build a full chain.
        INSUFFICIENT_COVERAGE = 8;

        // A chain was built but every candidate for at least one
        // position failed mid-inference (most peers don't actually
        // have a working inference handler).
        ALL_CANDIDATES_FAILED = 9;

        // The local InferenceEngine couldn't load the requested
        // model (HF download error, Ollama blob missing, OOM, etc.).
        // Only emitted by the `generate` path, not `shard_run`.
        MODEL_LOAD_FAILED = 10;
    }
    Code code = 1;
    string message = 2;
}

// =====================================================================
// Request / reply bodies referenced by ClientFrame / ServerFrame
// =====================================================================

message PingRequest {
}

message PingReply {
    // Wall-clock time on the daemon, RFC 3339.
    string server_time = 1;
}

// `kwaainet generate <PROMPT>` — single-node local inference.
message GenerateRequest {
    // Conventional roles: "user", "assistant", "system". Free-form.
    string role = 1;
    string content = 2;

    // Optional client-supplied conversation id for future multi-turn.
    // Ignored today.
    optional string conversation_id = 3;

    // 4-15 reserved for high-frequency metadata.
    // 16+ reserved for sampling/tool/attachment payloads.
}

// `kwaainet shard run <PROMPT>` — distributed inference across the mesh.
message ShardRunRequest {
    string role = 1;
    string content = 2;

    // Optional model override. Defaults to the daemon's configured
    // model when empty.
    optional string model = 3;

    optional string conversation_id = 4;

    // Emit InferenceEvent frames on this operation id, interleaved with
    // tokens, describing peer/block routing as it happens.
    //
    // Off by default, and deliberately opt-in: a chain of N hops over T
    // tokens produces O(N*T) events, which is real formatting work for a
    // client that isn't showing them — and they share this operation's
    // channel with the tokens, so producing them unasked adds
    // backpressure to the path the user is actually waiting on.
    //
    // A daemon predating this field ignores it. One that honours it emits
    // RESOLVED before any token or Done, so a token or Done with no event
    // before it means an old daemon.
    bool events = 5;

    // 6-15 reserved for high-frequency metadata.
    // 16+ reserved for sampling controls / routing hints.
}

// `kwaainet status` — daemon-side state snapshot.
message StatusRequest {
}

message StatusReply {
    // Daemon wall-clock time, RFC 3339 — same format as PingReply.
    string server_time = 1;

    // The model this node is configured to serve.
    string model = 2;

    // True when the local shard server (the one this node contributes
    // to the mesh) is up and serving its block range.
    bool shard_ready = 3;

    // Number of peers currently in the routing table (best-effort
    // snapshot from kwaai-p2p-daemon).
    uint32 peer_count = 4;

    // Daemon process uptime in seconds.
    uint64 uptime_secs = 5;

    // Version of the running daemon binary (CARGO_PKG_VERSION), e.g.
    // "0.5.4" — no leading "v". Lets a client report the version of the
    // process it is actually talking to, which can differ from whatever
    // binary is on disk after an upgrade or a config change that has not
    // been restarted into yet.
    //
    // Empty when talking to a daemon built before this field existed;
    // clients should treat "" as unknown rather than as a version.
    string version = 6;

    // Bootstrap connectivity, for surfacing "my configured initial peers
    // are down" to clients. `bootstrap_total` counts the distinct peer IDs
    // derivable from the configured bootstrap set (initial_peers, or the
    // built-in defaults when that list is absent); entries without a /p2p
    // component contribute nothing, so 0 with peers configured means the
    // condition is unknowable, not healthy.
    //
    // `bootstrap_reachable` counts those that are currently connected OR
    // successfully established a connection within the last ~15 minutes.
    // Recency, not the live set, because bootstraps close idle connections
    // (~30s) while the announce loop re-contacts them every ~5 minutes, so
    // a healthy idle node keeps refreshing inside the window. And not the
    // routing table, because kad seeds it with the configured addresses
    // before any dial succeeds — membership proves nothing.
    //
    // Both 0 on daemons built before these fields existed and on the Go
    // p2p path; clients should only act on reachable == 0 when total > 0.
    uint32 bootstrap_total = 7;
    uint32 bootstrap_reachable = 8;
}

// `kwaainet shard chain` — model block coverage from the DHT.
message BlockCoverageRequest {
    // DHT prefix to query. Defaults to the daemon's configured model
    // prefix when empty.
    optional string dht_prefix = 1;

    // Total transformer blocks in the model. Defaults to the daemon's
    // model config (`num_hidden_layers`) when unset.
    optional uint32 total_blocks = 2;

    // When true the operation stays open and the server pushes a fresh
    // BlockCoverageUpdate every `interval_secs` until the client sends
    // a Cancel body for this op id. When false a single update is sent
    // followed by Done.
    bool subscribe = 3;

    // Refresh cadence for subscriptions, in seconds. 0 means the
    // server default (5s). Ignored when `subscribe` is false.
    uint32 interval_secs = 4;
}

// One peer serving a contiguous block range, as announced in the DHT.
message BlockPeer {
    // libp2p peer id, base58.
    string peer_id = 1;

    // Served block range: [start_block, end_block).
    uint32 start_block = 2;
    uint32 end_block = 3;

    // Human-readable name the peer announced (may be empty).
    string public_name = 4;

    // Tokens/sec the peer claimed in its DHT announcement (0 = unknown).
    double throughput = 5;

    // Local reputation score in [0, 1]. Only meaningful when
    // `trust_tier` is non-empty.
    double trust_score = 6;

    // Trust tier label ("UNKNOWN" / "KNOWN" / "VERIFIED" / "TRUSTED").
    // Empty when the local reputation system is disabled.
    string trust_tier = 7;
}

// Snapshot of which peers cover which blocks of the model.
message BlockCoverageUpdate {
    // Daemon wall-clock time of this snapshot, RFC 3339.
    string server_time = 1;

    // The model whose coverage was queried (daemon's configured model).
    string model = 2;

    // The DHT prefix actually queried.
    string dht_prefix = 3;

    // Total transformer blocks in the model.
    uint32 total_blocks = 4;

    // Number of blocks covered by at least one peer.
    uint32 covered_blocks = 5;

    // True when every block is covered — distributed inference ready.
    bool full_coverage = 6;

    // All discovered block servers, sorted by start_block.
    repeated BlockPeer peers = 7;
}

// `kwaainet p2p peers list`, and more — local swarm state.
//
// Requires the native p2p stack. The Go p2p daemon's control protocol
// reports only (peer id, addresses) per connection, so direction,
// protocols, latency and the routing table have nowhere to come from;
// rather than serve a mostly-blank view the daemon answers
// UNIMPLEMENTED, which a client should treat as permanent for the
// daemon's lifetime. UNAVAILABLE means something different here — the
// native node is still starting and a retry will succeed.
message NetworkRequest {
    // When true the operation stays open and the server pushes updates
    // until the client sends a Cancel body for this op id. When false a
    // single update is sent followed by Done.
    bool subscribe = 1;

    // Refresh cadence for subscriptions, in seconds. 0 means the server
    // default (5s). Ignored when `subscribe` is false.
    //
    // This is the *sampling* floor, not the whole story: connections and
    // the routing table have no event source and so are polled, but
    // reachability changes are pushed the moment they happen. See
    // NetworkUpdate.reason.
    uint32 interval_secs = 2;
}

// Why a NetworkUpdate was sent.
//
// Without this a client cannot tell a routine sample from a genuine
// event, and would have to infer it by diffing successive snapshots.
enum UpdateReason {
    // The refresh timer fired and something changed, or this is the
    // single update of a one-shot request.
    UPDATE_REASON_TICK = 0;

    // Reachability, relay use, or announceability moved. Sent
    // immediately rather than on the next tick boundary.
    UPDATE_REASON_REACHABILITY = 1;

    // The connected-peer or routing set changed since the last update.
    UPDATE_REASON_PEERS = 2;

    // Nothing changed. Sent periodically so a client can distinguish a
    // quiet network from a stalled feed.
    UPDATE_REASON_HEARTBEAT = 3;
}

// How a connection reaches the peer.
enum PeerConnKind {
    // A plain transport address — directly dialable.
    PEER_CONN_KIND_DIRECT = 0;

    // The path runs through a circuit relay.
    PEER_CONN_KIND_RELAY = 1;
}

// One live connection.
//
// Per connection, not per peer: a peer reachable both directly and over
// a relay appears twice, which is what makes a hole-punch upgrade
// visible while it happens.
message ConnectedPeer {
    // libp2p peer id, base58.
    string peer_id = 1;

    // The connection's multiaddr — the remote address for outbound
    // connections, the observed send-back address for inbound ones.
    string addr = 2;

    PeerConnKind kind = 3;

    // "inbound" if the peer dialed us, "outbound" if we dialed them.
    string direction = 4;

    // Set when this peer is one of our configured bootstrap nodes.
    bool is_bootstrap = 5;

    // Set when this peer is one of our configured trusted relays.
    bool is_trusted_relay = 6;

    // Protocols the peer advertised over identify. Empty until identify
    // completes, which is shortly *after* the connection establishes —
    // empty means "not yet known", not "speaks nothing".
    repeated string protocols = 7;

    // Most recent ping round-trip time. 0 means no ping has completed
    // yet, not zero latency.
    uint32 rtt_ms = 8;

    // The peer's advertised software version. May be empty.
    string agent_version = 9;

    // The relay an inbound connection arrived through, when it was
    // relayed. Empty otherwise.
    //
    // An inbound relayed connection's `addr` is a bare `/p2p/<peer>`: it
    // names who reached us and says nothing about how. This is the local
    // end of that connection — our circuit listener — and is the only
    // place the relay's address and identity appear. Outbound needs no
    // equivalent, since the dialled address already carries the relay.
    string via = 11;

    // Whether DCUtR upgraded this connection from a relayed path to a
    // direct one.
    //
    // Only ever true alongside PEER_CONN_KIND_DIRECT, and it means
    // something stronger: the path was established *through* a NAT by
    // coordinated simultaneous dial, rather than there being no NAT in
    // the way. A node reporting "private" reachability can still hold
    // upgraded connections — that is DCUtR working, not a
    // contradiction.
    bool dcutr = 10;

    // Whether this peer serves the DHT, from its advertised protocols.
    //
    // Separate from is_bootstrap/is_trusted_relay rather than a variant
    // of them: those are operator configuration, this is observed peer
    // behaviour, and they are independent. A client-mode peer still
    // advertises circuit relay hop, and a relayed node of ours runs kad
    // in client mode while remaining a full peer — so "client" is a
    // marker on a row, not a role that replaces the others.
    DhtRole dht_role = 12;
}

// A peer's DHT participation, as reported by identify.
//
// Three states, not a bool: identify completes shortly *after* the
// connection establishes, so a freshly-connected peer has no protocol
// list yet. UNKNOWN keeps that gap honest — a client filtering on this
// would otherwise blink rows in and out as connections settle.
enum DhtRole {
    // Identify has not reported this peer's protocols yet.
    DHT_ROLE_UNKNOWN = 0;

    // Advertises kad: a routing hop that can store records and be
    // returned as a lookup result.
    DHT_ROLE_SERVER = 1;

    // Identify completed and kad was absent. Queries the DHT without
    // serving it. Common and permanent — every hivemind/Python process
    // proxies through such a peer, and rust-libp2p nodes sit in this
    // mode until reachability resolves.
    DHT_ROLE_CLIENT = 2;
}

// One entry in the Kademlia routing table.
//
// The routing table and the connected set overlap but neither contains
// the other: k-buckets hold a bounded number of entries per distance
// range, the table deliberately retains peers we are not currently
// connected to, and kad stays in client mode (adding nothing) until
// reachability resolves. A young node can have live connections and an
// empty table.
message RoutingPeer {
    // libp2p peer id, base58.
    string peer_id = 1;

    // Whether this peer also appears in NetworkUpdate.connected.
    bool connected = 2;

    // Whether this peer is one of our configured bootstrap nodes.
    //
    // Derived from local configuration, the same way it is for a
    // connection: the DHT does not label bootstraps, and which nodes
    // hold that role is the operator's choice.
    bool is_bootstrap = 3;

    // The addresses the routing table holds for this peer, as multiaddr
    // strings.
    //
    // Empty means kad knows the peer but has no address a third party
    // could dial — a materially different state from "known and not
    // currently connected", and one a peer id alone cannot express. It is
    // also what makes a poisoned entry legible: a peer whose only address
    // is its own loopback reads as healthy until the address is visible.
    repeated string addrs = 4;

    // Kad's own liveness verdict for this entry.
    //
    // Not the same claim as `connected`, which is the swarm's live
    // connection set: kad marks an entry Disconnected on connection close
    // but keeps it in the bucket, and it lags the swarm by an event loop
    // turn either way. A row where the two disagree is the normal
    // steady state for a peer we have dropped and still know how to reach.
    KadStatus kad_status = 5;

    // Which k-bucket holds this entry: floor(log2(XOR distance)), 0-255.
    //
    // Derived from the distance rather than the iteration order, so it is
    // the bucket's real index and not a position in a filtered walk.
    uint32 bucket = 6;

    // How many entries that bucket currently holds, and the k it is capped
    // at. Together they say whether the bucket is full — which is what
    // decides if a newly-discovered peer can be inserted at all, or has to
    // wait as a pending replacement for a disconnected occupant.
    uint32 bucket_entries = 7;
    uint32 bucket_capacity = 8;

    // Whether that bucket holds a pending node: a peer waiting to take the
    // place of a disconnected entry. Per bucket, not per entry — every
    // entry in a full bucket reports the same flag.
    bool bucket_pending = 9;

    // XOR distance from our own key to this peer's, big-endian hex, 64
    // digits, no leading `0x`.
    //
    // The DHT's own metric, and the only way to check that a lookup
    // actually walked closer. Fixed for the life of the entry, so it costs
    // nothing in subscription churn.
    string distance = 10;

    // Seconds since we last *established* a connection to this peer, in
    // either direction. Absent means never — which is a real and common
    // state for a routing entry: kad holds a peer the moment a configured
    // address is seeded into it, before any dial has succeeded.
    //
    // Deliberately not part of the subscription's change identity, for the
    // same reason as `rtt_ms`: it moves every tick and would turn a quiet
    // node into a 5-second frame generator. The value a client holds is
    // therefore as of the last snapshot it was actually sent.
    optional uint32 last_contact_secs = 11;
}

// Kad's view of a routing entry's liveness.
//
// Distinct from `RoutingPeer.connected` — see the field. UNSPECIFIED is
// reserved for a daemon predating the field rather than a third real
// state: kad itself has only the two.
enum KadStatus {
    KAD_STATUS_UNSPECIFIED = 0;
    KAD_STATUS_CONNECTED = 1;
    KAD_STATUS_DISCONNECTED = 2;
}

// This node's own position in the network.
message SelfStatus {
    // Our libp2p peer id, base58.
    string peer_id = 1;

    // "unknown" until a verdict is reached, then "public" or "private".
    // Announcing is deferred while unknown.
    string reachability = 2;

    // What produced the verdict, weakest evidence first: "identify"
    // (enough distinct peers reported the same address), "upnp" (the
    // local gateway says it mapped us), "autonat" (a peer dialed us back
    // and got through) or "declared" (operator configuration — an
    // instruction, not evidence at all). Empty unless reachability is
    // "public": a private or undecided verdict has no source.
    string reachability_source = 3;

    // Whether at least one *confirmed* circuit reservation is live. A
    // requested-but-unanswered reservation does not count.
    bool using_relay = 4;

    // Whether there is any point announcing to the DHT yet. False only
    // while reachability is unknown.
    bool announceable = 5;

    // The swarm's listen addresses.
    repeated string listen_addrs = 6;

    // Addresses peers reported observing us at — our external-address
    // candidates. Ordered by the number of distinct peers that agreed,
    // most-confirmed first.
    repeated string observed_addrs = 7;

    // Addresses of confirmed circuit-relay reservations. Empty when not
    // relaying.
    repeated string relay_addrs = 8;

    // Protocols this node serves to peers, sorted.
    //
    // The handlers actually registered rather than everything the swarm
    // might negotiate: libp2p keeps its full advertised set private, and
    // this is the more useful answer anyway — it is what this node will
    // *do* for a peer, which is what a reader comparing it against a
    // peer's protocol list wants to know.
    repeated string local_protocols = 9;

    // What IPv6 ended up doing: "off" | "active" | "unavailable". Empty
    // from a daemon predating the field.
    string ipv6 = 10;
}

// Snapshot of local p2p state.
//
// A subscription suppresses unchanged snapshots, so a client should read
// silence as "nothing changed" rather than as a stalled feed — an
// unchanged snapshot is still sent periodically as a heartbeat, so a
// feed quiet for much longer than the heartbeat is genuinely wedged.
message NetworkUpdate {
    // Daemon wall-clock time of this snapshot, RFC 3339.
    string server_time = 1;

    UpdateReason reason = 2;

    SelfStatus self_status = 3;

    // One entry per live connection, ordered bootstrap → trusted relay →
    // direct → relayed, then by peer id, so the ordering is stable
    // across updates.
    repeated ConnectedPeer connected = 4;

    // The Kademlia routing table, sorted by peer id.
    repeated RoutingPeer routing = 5;

    // Bootstrap connectivity, so a client can tell "my configured initial
    // peers are down" apart from ordinary churn. Same definitions as the
    // StatusReply pair: `bootstrap_total` is the distinct peer IDs derivable
    // from the configured bootstrap set (0 = unknowable, not healthy), and
    // `bootstrap_reachable` counts those connected or successfully connected
    // within the last ~15 minutes — see StatusReply for why neither the live
    // set nor the routing table can carry this on its own.
    //
    // Both fields are part of the subscription's change identity, so a flip
    // in either direction — a bootstrap appearing, or the count falling as
    // the contact window expires — is pushed on the next sample rather than
    // suppressed as an unchanged snapshot.
    uint32 bootstrap_total = 6;
    uint32 bootstrap_reachable = 7;
}

// `kwaainet vpk discover` — VPK storage nodes from the DHT.
message StorageDiscoveryRequest {
    // When true the operation stays open and the server runs a fresh
    // discovery round every `interval_secs` until the client sends a
    // Cancel body for this op id. When false a single round runs and
    // the op ends with Done.
    bool subscribe = 1;

    // Discovery cadence for subscriptions, in seconds. 0 means the
    // server default (30s). Ignored when `subscribe` is false.
    //
    // Slower than block coverage by default: each round dials every
    // advertised node, so a tight interval spends real network work to
    // observe a registry that only changes on the ~120s announce cycle.
    uint32 interval_secs = 2;

    // Skip the reachability probes and report DHT records only. Yields
    // a single StorageUpdate per round with every peer left UNKNOWN,
    // for callers that just want the advertised registry cheaply.
    bool skip_probes = 3;
}

// Whether a discovered node answered a storage RPC.
//
// Reachability is a property of *this* node's route to the peer, not of
// the peer itself: a node behind a NAT that we cannot traverse is
// unreachable from here and fine from elsewhere.
enum StorageReachability {
    // Not probed yet. Every peer holds this in the first update of a
    // round, and keeps it for the whole round when `skip_probes` is set.
    STORAGE_REACHABILITY_UNKNOWN = 0;

    // Answered a /kwaai/storage/1.0.0 health RPC. `capacity_gb_free`
    // and `tenant_count` on this peer are live values from that reply.
    STORAGE_REACHABILITY_REACHABLE = 1;

    // Advertised in the DHT but did not answer — offline, or running a
    // build without the storage protocol.
    STORAGE_REACHABILITY_UNREACHABLE = 2;
}

// One VPK-capable node, as advertised in the DHT and (optionally)
// confirmed by a live health probe.
message StoragePeer {
    // libp2p peer id, base58.
    string peer_id = 1;

    // Human-readable name the node announced (may be empty).
    string public_name = 2;

    // VPK role: "bob" (client), "eve" (server), or "both".
    string mode = 3;

    // VPK version string the node announced (may be empty).
    string vpk_version = 4;

    // Capacity the node advertised in its DHT record, in GB. Always
    // present — this is what the registry claims.
    double capacity_gb = 5;

    // Tenants the node advertised in its DHT record.
    uint32 tenant_count = 6;

    // Whether this node answered a health probe this round.
    StorageReachability reachability = 7;

    // Free capacity in GB, from the health probe. Only meaningful when
    // `reachability` is REACHABLE; 0 otherwise.
    double capacity_gb_free = 8;

    // Local reputation score in [0, 1]. Only meaningful when
    // `trust_tier` is non-empty.
    double trust_score = 9;

    // Trust tier label ("UNKNOWN" / "KNOWN" / "VERIFIED" / "TRUSTED").
    // Empty when the local reputation system is disabled.
    string trust_tier = 10;
}

// Snapshot of the VPK storage nodes visible from this daemon.
//
// The first discovery round emits two of these: one as soon as the DHT
// answers (`probes_pending` true, every peer UNKNOWN), and one once the
// health probes resolve. The DHT lookup is fast and the probes are not —
// splitting them lets a client render the registry immediately rather
// than holding a blank view until the slowest dial times out.
//
// Subsequent rounds emit at most one update, and only when something
// actually changed: re-sending the pending phase would throw a client's
// status column back to "checking" every round, and an unchanged
// resolved snapshot is suppressed. A client should therefore treat
// silence as "nothing has changed", not as a stalled feed — an unchanged
// snapshot is still sent periodically as a heartbeat, so a feed that
// goes quiet for much longer than the discovery interval is genuinely
// wedged.
message StorageUpdate {
    // Daemon wall-clock time of this snapshot, RFC 3339.
    string server_time = 1;

    // True on the pending update that opens the *first* round: the peer
    // list is complete but reachability is still resolving, so a client
    // should show the rows in a pending state rather than as
    // unreachable. Never set on later rounds, and never when
    // `skip_probes` was set.
    bool probes_pending = 2;

    // All discovered nodes, sorted by public_name then peer_id so the
    // ordering is stable across rounds.
    repeated StoragePeer peers = 3;
}

// Dial a peer we know of but hold no connection to.
//
// A bare peer id is resolved through the DHT first, the way Go's routed
// host does it, so the caller does not need an address — which is the
// point: the routing table knows peers it has no connection to, and this
// is how you reach one.
//
// Note this makes *us* the dialer, so it will not trigger a DCUtR
// upgrade: libp2p has the inbound side initiate hole punching.
message ConnectRequest {
    // libp2p peer id, base58. An address is resolved via the DHT.
    string peer_id = 1;
}

message ConnectReply {
    // True when a connection exists after the attempt — including when
    // one already existed, since the caller's goal is met either way.
    bool connected = 1;

    // Failure detail, empty on success.
    string error = 2;
}

// =====================================================================
// Distributed-inference telemetry (Session.shard_run, opt-in)
// =====================================================================

// What stage of a distributed run an InferenceEvent describes.
//
// Open enum: a client that does not recognise a value must render the
// event's `message` generically rather than dropping it, so a newer
// daemon's added phases stay legible on an older client.
enum InferencePhase {
    // Declared in the order a run emits them. Tag numbers are frozen
    // history — the wire contract is append-only — so PEER_DIAL_START
    // is 13 despite preceding PEER_DIAL (6).
    //
    // The run model behind the ordering: this node is the coordinator
    // for the whole run. It discovers and pins the chain, dials the
    // members, and then drives every hop itself — a hop is one
    // round-trip from here to one peer, which runs its contiguous slice
    // of the model's blocks on the activations we sent and returns the
    // resulting activations to us (peers never forward to each other).
    // One full pass through the chain yields logits, one token is
    // sampled from them, and the pass repeats for the next token.

    INFERENCE_PHASE_UNSPECIFIED = 0;

    // Run accepted; model / dht_prefix / total_blocks resolved.
    // Sets: model, dht_prefix, total_blocks.
    INFERENCE_PHASE_RESOLVED = 1;

    // A DHT discovery round is starting. Sets: attempt, dht_prefix.
    INFERENCE_PHASE_DISCOVERY_START = 2;

    // A discovery round returned. Sets: attempt, peer_count,
    // covered_blocks, total_blocks. peer_count == 0 means the round
    // found nothing and another attempt follows, up to the 30s cap.
    INFERENCE_PHASE_DISCOVERY_RESULT = 3;

    // The chain came from a saved circuit rather than the DHT.
    // Sets: circuit_id, peer_count.
    INFERENCE_PHASE_CIRCUIT_LOADED = 4;

    // The route for this run was pinned. Sets: hops (ordered, gapless,
    // covering [0, total_blocks)) and total_blocks. Re-emitted after a
    // rebuild with `attempt` incremented.
    INFERENCE_PHASE_CHAIN_PINNED = 5;

    // A best-effort dial of a chain member is about to be attempted,
    // answered later by a PEER_DIAL for the same peer. Announced up
    // front because the dial can take tens of seconds to time out,
    // during which a result-only event would leave a client unable to
    // say who is being waited on. Sets: peer_id, peer_name, is_self.
    INFERENCE_PHASE_PEER_DIAL_START = 13;

    // The dial's result. Sets: peer_id, peer_name, ok, and (since
    // PEER_DIAL_START was added) duration_ms.
    INFERENCE_PHASE_PEER_DIAL = 6;

    // A hop is being dispatched: the coordinator is sending this
    // token's activations to the peer serving [block_start, block_end).
    // Sets: peer_id, peer_name, block_start, block_end, is_self,
    // token_index, is_prefill, candidate_index.
    INFERENCE_PHASE_HOP_START = 7;

    // The hop returned its activations (or, from the last hop, logits).
    // Sets everything HOP_START does, plus duration_ms.
    INFERENCE_PHASE_HOP_OK = 8;

    // A hop failed. Sets everything HOP_START does, plus duration_ms,
    // message (the error) and failure. Followed by a HOP_START for the
    // next candidate at the same block_start; when none is left, by
    // PATH_REBUILD, or by the operation's Error if this token's one
    // rebuild was already spent.
    INFERENCE_PHASE_HOP_FAILED = 9;

    // No candidate could serve block_start, so the path is being rebuilt
    // and the token retried once. Usually follows HOP_FAILED, but comes
    // alone when no peer covered block_start at all. The KV cache is
    // lost, so output may degrade. Sets: block_start, message, attempt,
    // token_index, is_prefill, session_id, seq_pos.
    INFERENCE_PHASE_PATH_REBUILD = 10;

    // A token was sampled from the logits the last hop returned —
    // generation is autoregressive, so every token costs one full pass
    // through the chain, and this closes that pass. Sets: token_index,
    // is_prefill, duration_ms (wall time for the whole pass).
    INFERENCE_PHASE_TOKEN_SAMPLED = 11;

    // Generation finished. Sets: token_index (total generated),
    // duration_ms (whole run), message (the stop reason) and
    // dropped_events. Never itself dropped.
    INFERENCE_PHASE_COMPLETE = 12;
}

// Why a hop failed, which decides whether the peer stays eligible for
// the rest of the run.
enum HopFailure {
    HOP_FAILURE_UNSPECIFIED = 0;

    // The peer answered but has no inference handler registered
    // ("protocols not supported"). Blacklisted for this run.
    HOP_FAILURE_NO_HANDLER = 1;

    // Stream reset, early eof, or connection closed. NOT blacklisted:
    // the peer may recover and is retried on the next token.
    HOP_FAILURE_TRANSIENT = 2;

    // Exceeded the per-hop deadline. Blacklisted for this run.
    HOP_FAILURE_TIMEOUT = 3;

    // Anything else. Blacklisted for this run.
    HOP_FAILURE_OTHER = 4;
}

// One hop of a pinned route: which peer serves which block range.
message InferenceHop {
    // libp2p peer id, base58.
    string peer_id = 1;

    // The name the peer announced in the DHT. May be empty.
    string peer_name = 2;

    // Served block range: [block_start, block_end).
    uint32 block_start = 3;
    uint32 block_end = 4;

    // Whether this hop dispatches to the local bypass server rather
    // than out over libp2p — i.e. this machine serves these blocks.
    bool is_self = 5;

    // Local reputation score in [0, 1]. Absent when the reputation
    // system is disabled.
    optional double trust_score = 6;

    // Tokens/sec the peer claimed in its DHT announcement. 0 = unknown.
    double throughput = 7;
}

// A single point-in-time event during a distributed run.
//
// Deliberately one flat message with a phase enum rather than a oneof
// of per-phase types: clients render these as a homogeneous log, and a
// flat shape means a future phase costs one enum value instead of a new
// message plus a new oneof arm — which matters under the append-only
// rule at the top of this file. It also degrades better across version
// skew, since an unknown enum value still carries a readable `message`
// where an unknown oneof arm is simply invisible.
//
// Which fields carry meaning depends on `phase`; see InferencePhase.
// Numerics that are not always applicable use explicit presence, so
// "0 ms" is distinguishable from "not applicable to this phase".
message InferenceEvent {
    // Milliseconds since the run started. Relative rather than absolute
    // so a client can render a timeline without trusting clock skew
    // between the daemon and itself.
    uint64 elapsed_ms = 1;

    InferencePhase phase = 2;

    // Human-readable detail. Always safe to display; for a phase the
    // client does not recognise it is the only thing to display.
    string message = 3;

    // ── Peer identity (HOP_*, PEER_DIAL) ──
    string peer_id = 10;
    string peer_name = 11;
    bool is_self = 12;

    // ── Block range (HOP_*, PATH_REBUILD, discovery) ──
    optional uint32 block_start = 20;
    optional uint32 block_end = 21;
    optional uint32 total_blocks = 22;
    optional uint32 covered_blocks = 23;

    // ── Timing ──
    optional double duration_ms = 30;

    // ── Sequencing ──
    // 0-based index of the token being produced. Token 0 is the prefill
    // pass over the whole prompt; every later token is a single-token
    // decode step. `is_prefill` says which, so a client does not have to
    // infer it from the index.
    optional uint32 token_index = 40;
    bool is_prefill = 41;

    // Which candidate at this block position, 0 = first choice. Greater
    // than 0 means earlier candidates for the same blocks already failed.
    optional uint32 candidate_index = 42;

    // Discovery round or path-rebuild generation, 1-based.
    optional uint32 attempt = 43;

    // Whether the action this event reports succeeded. Meaningful for
    // PEER_DIAL, where a failed dial is routine rather than fatal (the
    // peer may still be reachable at hop time); always true on HOP_OK.
    bool ok = 44;

    // ── Cross-node correlation ──
    // The two identifiers that also travel in every InferenceRequest, so
    // both ends of a hop name the same work the same way. A client can
    // take a hop from this stream and find it in the serving peer's log,
    // which is otherwise impossible — peer id and block range identify
    // *who* and *what*, but not *which request*.
    //
    // `session_id` is constant for a run and is the remote's KV-cache
    // key. Sent as a string because it is a u64 whose full range does not
    // survive JSON-based clients, and it is only ever compared or
    // displayed, never arithmetic.
    string session_id = 45;

    // Global sequence position of the first token in this call. NOT the
    // same as `token_index`: prefill covers the whole prompt, so this
    // advances by the prompt length and then by one per token. It is what
    // the serving peer logs, which is what makes it the field to grep on.
    optional uint32 seq_pos = 46;

    // ── Failure detail (HOP_FAILED) ──
    HopFailure failure = 50;

    // ── Discovery / resolution detail ──
    string model = 60;
    string dht_prefix = 61;
    optional uint32 peer_count = 62;
    string circuit_id = 63;

    // ── Route (CHAIN_PINNED only) ──
    repeated InferenceHop hops = 70;

    // ── Delivery (COMPLETE only) ──
    // Progress events dropped because this client fell behind. Non-zero
    // means some earlier events are missing, not that they never happened.
    optional uint32 dropped_events = 80;
}

// =====================================================================
// RAG bodies (feat/grpc-rag)
//
// These mirror the `kwaainet rag …` subcommands, except that ingest
// carries the document itself rather than a path: the client and the
// daemon need not share a filesystem.
//
// Transport note: phase 1 serves only knowledge bases whose
// storage_url is "local" (the embedded vector store). KBs outsourced
// to a remote Eve node answer UNIMPLEMENTED rather than silently
// returning nothing.
// =====================================================================

// One knowledge base as reported by rag_status / rag_init.
message RagKb {
    // KB name, e.g. "default". Unique per daemon.
    string name = 1;

    // Ollama embedding model this KB was initialised with. Chunks
    // embedded with a different model are not comparable, so this is
    // effectively part of the KB's identity.
    string embed_model = 2;

    // True when the KB's vectors live somewhere other than the local
    // embedded store (a remote Eve node or an HTTP storage service).
    // Phase 1 can report these but not query or ingest into them.
    bool remote = 3;

    // Documents ingested so far, each with its chunk count. Best-effort:
    // a KB whose metadata store can't be opened is still reported, with
    // an empty list, rather than failing the whole status op.
    repeated RagDoc documents = 4;
}

// One ingested document, as reported by rag_status.
message RagDoc {
    // Display name recorded at ingest — what rag_delete expects back.
    string name = 1;

    // Chunks this document contributed, which is also its vector count.
    // 0 when the metadata row exists but couldn't be read, rather than
    // omitting the document entirely.
    uint32 chunks = 2;
}

message RagStatusRequest {
}

message RagStatusUpdate {
    // Empty when RAG is compiled in but no KB has been initialised.
    repeated RagKb kbs = 1;
}

message RagInitRequest {
    // KB to create. Empty means "default". Re-initialising an existing
    // KB keeps its data directory and documents; a remote KB answers
    // UNIMPLEMENTED.
    string kb = 1;

    // Ollama embedding model. Empty means the daemon's default for a new
    // KB and the current model for an existing one. Changing the model of
    // a KB that holds documents fails with INVALID_ARGUMENT.
    string embed_model = 2;
}

message RagInitReply {
    // The KB as it exists after init. `documents` is empty for a fresh
    // KB and populated when init refreshed an existing one.
    RagKb kb = 1;
}

message RagIngestRequest {
    // KB to ingest into. Empty means "default".
    string kb = 1;

    // Display name for the document, required. Its extension picks the
    // parser (`.pdf`, `.docx`, …), so send the original file name.
    string doc_name = 2;

    // Total bytes the rag_ingest_data frames will carry, above 0 and at
    // most 256 MiB. The ingest starts once exactly this many have
    // arrived. A piece carrying bytes past it fails the ingest; pieces
    // sent after exactly `size` bytes are discarded.
    //
    // A daemon receives at most 4 uploads at once; beyond that the
    // ingest fails with UNAVAILABLE before any piece is read.
    uint64 size = 3;
}

// A piece of the document an ingest is uploading. Keep each well under
// the 4 MiB gRPC frame limit; 256 KiB is a good size.
//
// Flow control is a window of 8 pieces: at most 8 may be unacknowledged
// (sent, with no RAG_PHASE_RECEIVING frame for them yet). The server
// buffers no more, so a ninth can fail the ingest with INVALID_ARGUMENT.
// An upload that sends nothing for 60 s fails the same way.
message RagIngestData {
    bytes data = 1;
}

// Progress for an in-flight ingest. Deliberately ONE flat message with
// a phase enum rather than a oneof-per-phase: phases are a fixed,
// ordered pipeline sharing the same done/total shape, and a flat
// message lets a client render a progress bar without a match on
// every variant. Adding a phase later is then an enum value, not a
// new oneof arm every client must handle.
message RagProgress {
    enum RagPhase {
        RAG_PHASE_UNSPECIFIED = 0;

        // Receiving the document. done/total count bytes. Sent once per
        // piece, after it is written: each acknowledges one piece of the
        // 8-piece window (see RagIngestData). A client that does not read
        // these for 60 s fails the ingest.
        RAG_PHASE_RECEIVING = 1;

        // Decoding the document into plain text. done/total are both 0:
        // this phase is a single indivisible step.
        RAG_PHASE_EXTRACTING = 2;

        // Chunking, embedding and storing. done/total count chunks.
        RAG_PHASE_EMBEDDING = 3;
    }

    RagPhase phase = 1;

    // Units completed / expected for this phase. Both 0 when the
    // phase has no meaningful subdivision.
    uint32 done = 2;
    uint32 total = 3;

    // Optional human-readable detail (e.g. the document name).
    string detail = 4;
}

message RagIngestReply {
    uint32 chunks_ingested = 1;
    uint32 vectors_uploaded = 2;
}

message RagQueryRequest {
    // KB to query. Empty means "default".
    string kb = 1;

    // The query text.
    string text = 2;

    // Max chunks to return. 0 means the server default (20).
    uint32 top_k = 3;

    // Drop chunks scoring below this. 0 keeps everything.
    double min_score = 4;
}

// One retrieved chunk. Mirrors the JSON the HTTP RAG API returns.
message RagChunk {
    // 1-based position in the result list.
    uint32 rank = 1;
    double score = 2;

    // Document this chunk came from.
    string doc = 3;

    // 0-based index of the chunk within its document.
    uint32 chunk_index = 4;

    string text = 5;
}

message RagQueryReply {
    // Ordered best-first. Empty when nothing cleared min_score.
    repeated RagChunk chunks = 1;
}

message RagDeleteRequest {
    // KB to delete from. Empty means "default".
    string kb = 1;

    // Document name as reported in RagDoc.name — the display name the
    // ingest recorded, not a filesystem path. Deleting by name rather
    // than by chunk id keeps the client from having to know how a
    // document was split.
    string doc_name = 2;
}

message RagDeleteReply {
    // Chunks removed from the metadata store, which is also the number
    // of vectors dropped. Never 0 on success: a document with no chunks
    // answers NOT_FOUND instead.
    uint32 chunks_deleted = 1;
}

// =====================================================================
// Hivemind DHT records
// =====================================================================

// List the DHT records this node holds locally — the only listing that
// exists. Kademlia has no key-enumeration operation, so what a node
// holds is answerable in full while "what is in the DHT" is not; use
// DhtLookupRequest for a key you already know the name of.
message DhtRecordsRequest {
    // Fill in `value` and `subkeys`. Requires a non-empty `key_ids`:
    // values run to a megabyte each, so a whole-store listing carrying
    // them could not fit one frame. INVALID_ARGUMENT otherwise.
    bool include_values = 1;

    // Restrict the listing to these DHT ids (hex, as reported in
    // DhtRecord.key_id). Empty lists everything.
    repeated string key_ids = 2;

    // Maximum records to return. 0 uses the daemon's default (500);
    // above its ceiling (5000) it is clamped, not rejected.
    uint32 limit = 3;
}

message DhtRecordsReply {
    // Daemon wall-clock time of this snapshot, RFC 3339.
    string server_time = 1;

    // Live records, primary tier first, then cache, each tier in key
    // order. A key held in both appears twice: the copies carry their
    // own expirations and values, and a find serves whichever expires
    // later, so they are genuinely two records.
    repeated DhtRecord records = 2;

    // The keys this node can name: the registries plus one per block of
    // its configured prefix. Both the reverse table for
    // DhtRecord.key_name — a DHT id is SHA1(msgpack(name)) and cannot be
    // inverted — and the candidate list for DhtLookupRequest.
    repeated DhtKnownKey known_keys = 3;

    // Records matching the filter before `limit` was applied. Greater
    // than `records.len()` means the listing was cut short.
    uint32 total_records = 4;
}

// A plaintext key name and the DHT id it hashes to.
message DhtKnownKey {
    // e.g. `_petals.models`, `_kwaai.vpk.nodes`, `Qwen3-8B.0`.
    string name = 1;
    // SHA1(msgpack(name)), hex.
    string key_id = 2;
}

// One DHT record: a stored value plus everything known about it that is
// not the value itself.
message DhtRecord {
    // The record's DHT id, hex. This is the key the store is indexed
    // by, and what `key_ids` filters on.
    string key_id = 1;

    // The plaintext name, when this id matches one this node knows how
    // to derive. Empty otherwise, which is the normal case for a record
    // replicated onto us for a model we do not serve — the id is a hash
    // and there is nothing to invert.
    string key_name = 2;

    // Regular value vs dictionary. The distinction is not cosmetic: a
    // dictionary is how N peers announce under one key without
    // overwriting each other, so a block key with one subkey per server
    // is the shape to expect, and a *regular* value under such a key is
    // a peer that clobbered the others.
    DhtRecordKind kind = 3;

    // Cache tier rather than primary. A cached record is here because a
    // lookup passed through this node, not because anyone chose to
    // replicate onto it, and it is evictable.
    bool in_cache = 4;

    // Subkeys held for a dictionary, 0 for a regular value; `kind`
    // separates those. Counts expired subkeys too: nothing prunes a
    // stored subkey once it expires — sweeping drops whole records, and
    // the freshness check only rejects incoming stores — so compare
    // each subkey's own expiration to see what is still live.
    uint32 subkey_count = 5;

    // Value bytes only: the stored value for a regular record, the
    // summed subkey values (expired ones included) for a dictionary.
    // Not the serialized wire size, which adds msgpack framing.
    uint64 value_bytes = 6;

    // The record's outer expiration, seconds since the UNIX epoch. The
    // one `rpc_find` reports, and for a dictionary it can differ from
    // `latest_expiration`.
    double expiration = 7;

    // Seconds until `expiration`, as of `server_time`. Never negative
    // in a local listing, which filters expired records; a lookup
    // result can be, since it is stamped with the answering peer's
    // clock. Sent alongside the absolute time because a client's clock
    // is not the daemon's.
    double expires_in_secs = 8;

    // `DictionaryDHTValue.latest_expiration_time` — the running maximum
    // over every subkey ever stored, which Python never recomputes on
    // expiry. Set for dictionaries only, and a value well past
    // `expiration` is normal rather than a bug.
    optional double latest_expiration = 9;

    // The dictionary's own subkey cap. Absent when unbounded, and for
    // regular records.
    optional uint64 dict_maxsize = 10;

    // The decoded value, when `include_values` was set. Absent for a
    // dictionary, whose values live per-subkey below.
    optional DhtValueView value = 11;

    // Per-subkey breakdown, when `include_values` was set and this is a
    // dictionary. Each subkey expires independently of the record.
    repeated DhtSubkey subkeys = 12;
}

message DhtSubkey {
    // The subkey rendered from its msgpack form — a base58 peer id for
    // every record this network publishes, but nothing enforces that,
    // so it is rendered by the same rules as a value.
    string subkey = 1;

    // Absolute expiration, seconds since the UNIX epoch, and the
    // countdown to it. Independent of the record's own expiration:
    // that is the whole point of a dictionary.
    double expiration = 2;
    double expires_in_secs = 3;

    uint64 value_bytes = 4;

    // The decoded value.
    DhtValueView value = 5;
}

// A msgpack value rendered for display.
//
// Deliberately structural, not semantic: this decodes msgpack and shows
// what is there. It does not know that an Ext(64) under a block key is a
// petals ServerInfo, and does not invent field names for one — an Ext
// body that is itself msgpack (which is what Python's tuple encoding
// produces) is unwrapped and rendered as its contents, and one that is
// not is reported as opaque bytes under its type code.
message DhtValueView {
    // Top-level msgpack type: `map`, `array`, `str`, `bin`, `int`,
    // `float`, `bool`, `nil`, or `ext`. `undecodable` when the bytes
    // are not msgpack at all, in which case `rendered` is their hex.
    string msgpack_type = 1;

    // The value as compact JSON — valid for `jsonDecode` whenever
    // `decoded` is true; when false it is the raw hex and must not be
    // parsed. What JSON cannot say is a one-key tagged object:
    //   str/bin that is not UTF-8   {"$hex": "<lowercase hex>"}
    //   NaN / ±inf                  {"$float": "nan" | "inf" | "-inf"}
    //   ext with a msgpack body     {"$ext": <code>, "value": <body>}
    //   ext with any other body     {"$ext": <code>, "$hex": "…"}
    // Bin that is valid UTF-8 renders as a string. A non-string map key
    // becomes its compact JSON text as the object key; keys that collide
    // after that collapse, last one wins.
    string rendered = 2;

    // Size of the value as stored, before any decoding.
    uint64 raw_bytes = 3;

    // The ext type code when the top level is an Ext, for out-of-band
    // display; `rendered` carries it too. 0x40 (64) is hivemind's
    // Python-tuple code and 0x50 (80) its dictionary code.
    optional int32 ext_code = 4;

    // True when `rendered` was produced by decoding, false when the
    // bytes defeated the decoder and it fell back to hex.
    bool decoded = 5;
}

enum DhtRecordKind {
    DHT_RECORD_KIND_UNSPECIFIED = 0;
    DHT_RECORD_KIND_REGULAR = 1;
    DHT_RECORD_KIND_DICTIONARY = 2;
}

// Resolve one key across the network — the counterpart to
// DhtRecordsRequest, and only ever possible for a key whose *name* is
// known, since the id is SHA1(msgpack(name)).
message DhtLookupRequest {
    // The plaintext key name — `_petals.models`, `_kwaai.vpk.nodes`,
    // `_kwaai.inference.nodes`, `<prefix>.<block>`, or anything else.
    // Hashed to its DHT id here.
    string key = 1;

    // Peers to ask, base58 peer ids. Empty means the node's configured
    // peers plus its routing table — whoever it was already going to
    // talk to. A node configured with an explicitly empty peer list
    // gets UNAVAILABLE, never a fallback to a compiled-in bootstrap.
    // Both lists are capped at 16 peers.
    repeated string peers = 2;

    // Per-peer budget. 0 uses the daemon's default.
    uint32 timeout_secs = 3;
}

message DhtLookupReply {
    string server_time = 1;

    // Echoed back with the id it hashed to, so a client can show what
    // was actually asked for.
    string key = 2;
    string key_id = 3;

    // One entry per peer asked, in the order asked. A peer that
    // answered NOT_FOUND is a real result — it is how you tell "nobody
    // has this" from "nobody was reachable".
    repeated DhtLookupPeer peers = 4;

    // The freshest answer across every peer that returned one, by outer
    // expiration. Absent when no peer had the key.
    //
    // Its `in_cache` is meaningless here (nothing was stored locally)
    // and is always false; `key_name` is the requested key.
    optional DhtRecord record = 5;
}

message DhtLookupPeer {
    string peer_id = 1;
    DhtLookupOutcome outcome = 2;

    // Failure detail when `outcome` is ERROR, empty otherwise. A dial
    // failure and a protocol refusal both land here — the text
    // distinguishes them.
    string error = 3;

    // Round trip for this peer, including any dial it had to make.
    uint32 elapsed_ms = 4;

    // What this peer returned, when `outcome` is FOUND. Kept per peer
    // rather than only merged, because peers disagreeing about a record
    // is exactly what a reader is looking for.
    optional DhtRecord record = 5;
}

enum DhtLookupOutcome {
    DHT_LOOKUP_OUTCOME_UNSPECIFIED = 0;
    // The peer answered and had the key.
    DHT_LOOKUP_OUTCOME_FOUND = 1;
    // The peer answered and did not have it.
    DHT_LOOKUP_OUTCOME_NOT_FOUND = 2;
    // We never got an answer: dial failure, timeout, or a refusal.
    DHT_LOOKUP_OUTCOME_ERROR = 3;
}

// =====================================================================
// Legacy types (used by Chat / Ping rpcs above; superseded by the
// Session bodies). Kept stable for back-compat with existing clients.
// =====================================================================

message ChatMessage {
    string content = 1;
    string role = 2;
    optional string conversation_id = 3;
}

message ChatToken {
    string text = 1;
    bool done = 2;
    optional string finish_reason = 3;
}
