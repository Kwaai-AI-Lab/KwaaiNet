[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+fp16,+fullfp16"]

# /usr/lib/libcuda.so on this machine is 32-bit; inject the 64-bit path first
# so lld doesn't grab the wrong one before /usr/lib64 is searched.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-L", "/usr/lib64"]

[env]
# MACOSX_DEPLOYMENT_TARGET stays unset: rustc's default (11.0 arm64, 10.12 Intel).
# MLX refuses below 14.0, so its CMake build alone gets 14.0.
CMAKE_TOOLCHAIN_FILE_aarch64_apple_darwin = { value = "cmake/mlx-macos14.cmake", relative = true }
# mlx-sys writes mlx.metallib here; kwaai-inference's build script embeds it.
MLX_RS_METAL_PATH = { value = "target/mlx-metallib", relative = true }
