name: CI

# Fast gate: fmt + clippy + tests run in parallel.
# Target wall-clock: ~12-15 min on a warm cache, ~20-25 min cold.
#
# What changed vs the old ci.yml:
#   - build.rs skips `go build` when binary already exists (cached target/)
#   - protoc installed via apt instead of downloaded at runtime by build.rs
#   - Go module cache enabled on all jobs that need Go
#   - Single unified cargo cache key shared by clippy + test (same artifacts)
#   - clippy uses default features only (was --all-features; CUDA/Metal are
#     only needed for the release build, not the lint gate)
#   - test matrix: ubuntu only on PRs; ubuntu + macOS on pushes to main
#   - wasm-pack binary cached so `cargo install wasm-pack` only runs once
#   - dropped `build --release` job (slow, redundant with release.yml)
#   - dropped `docs` job (nice-to-have, not a merge gate)
#   - added a Windows `cargo check` job (#146) — every other job is Linux, so
#     Windows-only breakage used to reach main and sit there until a release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── 1. Formatting (instant fail-fast, no cargo cache needed) ───────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patched deps
        run: bash core/patches/fetch-multistream-select.sh
        working-directory: ${{ github.workspace }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: core
        run: cargo fmt --all -- --check

  # ── 1b. Memory integrity (seconds; no toolchain, no cache) ────────────────
  # CLAUDE.md files are read by agents as authoritative, so a stale claim is
  # amplified rather than noticed. They describe code, which moves without
  # anyone opening the doc — a review ritual cannot catch that, a check can.
  memory:
    name: Memory integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # drift detection reads commit dates
      - name: Check CLAUDE.md and glossary references resolve
        run: python3 scripts/check_memory_integrity.py

  # ── 2. Clippy (default features — CUDA/Metal checked only in release.yml) ──
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patched deps
        run: bash core/patches/fetch-multistream-select.sh
        working-directory: ${{ github.workspace }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

  # ── 3. Tests (ubuntu for PRs; ubuntu + macOS on pushes to main) ────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJson('["ubuntu-latest"]') || fromJson('["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: fetch patched deps
        run: bash core/patches/fetch-multistream-select.sh
        working-directory: ${{ github.workspace }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        working-directory: core
        run: cargo test --all

  # ── 3b. Windows type check (#146) ──────────────────────────────────────────
  # `main` did not compile on Windows for five days between #130 and #142: a
  # field added to a struct was populated only in the `#[cfg(unix)]` arm, and
  # every CI job here runs on Linux. Windows was built only by release.yml, so
  # the first Windows compile of any change happened when a release was cut —
  # or when someone happened to build there, which is how it was actually found.
  #
  # `check`, not `build`: type checking catches that whole class — cfg-gated
  # fields, platform-specific imports, missing cfg arms — without CUDA or a
  # full link toolchain. Minutes rather than the better part of an hour.
  #
  # Cross-checking from macOS is not an option; `cargo check --target
  # x86_64-pc-windows-msvc` dies in ring's build script, which wants a Windows
  # C toolchain. It has to be a real Windows runner.
  windows-check:
    name: Windows check
    runs-on: windows-latest
    steps:
      # Some dependency paths exceed the 260-char default and fail to check out.
      - name: Enable long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      # Also the first PR-time exercise of this script under Git Bash. It was
      # previously reached on Windows only from release.yml, i.e. only on a tag
      # push, so a hashing problem there surfaced during a release.
      - name: fetch patched deps
        shell: bash
        run: bash core/patches/fetch-multistream-select.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # No sccache here: on Windows it rebuilds rustc's command line and blows
      # past the 32,767-character CreateProcess limit on web-sys's --check-cfg
      # feature list, dying before rustc runs. Cargo avoids this with @argfile.

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: '**/go.sum'

      # kwaai-p2p-daemon's build.rs writes p2pd to target/release/ unconditionally
      # and does not create the directory. Same step exists in release.yml.
      - name: Create target/release for the p2p-daemon build script
        shell: bash
        run: mkdir -p core/target/release

      # openssl-sys arrives transitively via reqwest/libp2p and needs pointing
      # at the runner's pre-installed OpenSSL.
      - name: Set OpenSSL paths
        shell: pwsh
        run: |
          $dir = Get-ChildItem "C:\Program Files" -Filter "OpenSSL*" -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if ($dir) {
            echo "OPENSSL_DIR=$dir" >> $env:GITHUB_ENV
          }

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock', '**/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      # --all-targets so tests and benches are checked too; cfg breakage lives
      # there as readily as in library code.
      - name: Check
        working-directory: core
        run: cargo check --workspace --all-targets

  # ── 4. WASM build (wasm-pack cached to avoid reinstall every run) ──────────
  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patched deps
        run: bash core/patches/fetch-multistream-select.sh
        working-directory: ${{ github.workspace }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Cache wasm-pack binary
        id: wasm-pack-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack (cache miss only)
        if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-pack

      - name: Cache cargo + target (wasm)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build WASM
        working-directory: core/crates/kwaai-wasm
        run: wasm-pack build --target web

  # ── 5. Dev binaries (push to main only — gives devs/QA a downloadable build) ─
  dev-binary:
    name: Dev binary (${{ matrix.target }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: fetch patched deps
        run: bash core/patches/fetch-multistream-select.sh
        working-directory: ${{ github.workspace }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-dev-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dev-

      - name: Build
        working-directory: core
        run: cargo build --release -p kwaainet

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kwaainet-dev-${{ github.sha }}-${{ matrix.target }}
          path: core/target/release/kwaainet
          retention-days: 30
