# Ontology for the NIST KB — AI risk management, adversarial ML, security standards.
# Arm B, foundation-model authored 2026-08-25, grounded in sampled corpus text
# (NIST AI 100-1 RMF, Managing Misuse Risk for Dual-Use Foundation Models,
# Vassilev et al. Adversarial ML Taxonomy, OWASP GenAI, MITRE ATLAS).
#
# 90.7% clean text, 7 relations from 5182 entities — vocabulary-bound.
# The corpus is itself a set of taxonomies, so the ontology is largely *given*
# rather than inferred, which is the standards case the framing doc predicted.
#
# v2, 2026-09-28. v1 fitted this corpus best of the pilot's four: the ontology arm
# raised both precision and yield. The test-set check found five gaps: authors
# (people and co-authoring agencies), ATLAS's tactics, "modeled after" and
# "profile of" between frameworks, and publication dates, versions and markings.
# Each addition carries its measured share of the 3,486 prose chunks;
# test-set-driven ones are marked "test-set".

ontology:
  name: ai-risk-standards
  version: 2
  extends: none

provenance:
  derivation: derived
  note: >-
    v1: 6 sampled chunks. v2 (2026-09-28): full-corpus probes over 3,486 prose
    chunks, the pilot's judged edges, and the 20 questions with their gold nuggets.

# Three genuinely different document kinds in one KB (Reza, 2026-08-25: a KB has
# several ontologies, not one). Normative standards, practitioner guidance, and
# adversarial-ML research assert different things and should not share one
# extraction vocabulary.
streams:
  - name: normative-standard
    description: NIST/ISO publications stating requirements.
    entity_types: [Framework, Function, Control, Organization, Publication]
    retention: irreducible_text     # requirement wording is the requirement
  - name: threat-research
    description: Adversarial ML papers and taxonomies.
    entity_types: [AttackTechnique, Tactic, Mitigation, AISystem, Asset, Publication, Person]
  - name: incident-report
    description: MITRE ATLAS-style reports of observed attacks in the wild.
    entity_types: [AttackTechnique, ThreatActor, Organization, Asset, AISystem]

entity_types:
  - name: Framework
    description: >-
      A named, structured body of guidance organising controls and functions.
    examples: ["AI Risk Management Framework", "NIST Cybersecurity Framework 2.0",
               "ISO/IEC 27001", "MITRE ATLAS"]
    irreducible: false

  - name: Function
    description: >-
      A top-level activity grouping within a framework. The AI RMF's are
      Govern, Map, Measure, Manage.
    examples: ["Govern", "Map", "Measure", "Manage"]
    irreducible: false

  - name: Control
    description: >-
      A specific recommended practice, safeguard, or requirement.
    # Requirement text is normative — the exact wording is the control.
    irreducible: true
    fields:
      - { key: normativeForce, desc: "shall | should | may (RFC 2119-style strength)" }

  - name: Risk
    description: >-
      A named adverse outcome the guidance exists to reduce.
    examples: ["misuse risk", "re-identification risk", "CB misuse risk"]
    irreducible: false

  - name: AttackTechnique
    description: >-
      A named adversarial method against an AI or ML system.
    examples: ["label-flipping attack", "data poisoning", "attribute inference attack",
               "model weight exfiltration"]
    anti_examples:
      - "Sysdig"        # an Organization that reported an attack
      - "RAND"          # a publisher
    irreducible: false

  - name: Mitigation
    description: >-
      A named defensive technique that reduces a specific risk or blunts a
      specific attack.
    examples: ["label cleaning", "outlier detection", "data sanitization"]
    irreducible: false

  - name: AISystem
    description: >-
      A model, model class, or deployed AI system that risks apply to.
    examples: ["dual-use foundation models", "LLM", "ensemble of multiple ML models"]
    irreducible: false

  - name: Asset
    description: >-
      A protected resource — model weights, training data, a deployment endpoint.
    examples: ["model weights", "synthetic health data", "training dataset"]
    irreducible: false

  - name: ThreatActor
    description: >-
      A named or described adversary observed conducting an attack. Only
      meaningful in the incident-report stream — a standards document has no
      threat actors, and conflating actor with technique is how ATLAS-style
      content collapses into the research vocabulary.
    examples: ["unknown actors targeting cloud LLM services"]
    irreducible: false

  - name: Organization
    description: >-
      A standards body, vendor, research institution, or reporting party.
    examples: ["NIST", "OWASP", "RAND", "OpenAI", "ISO"]
    irreducible: false

  - name: Publication
    description: >-
      A named standard, report, or paper. Distinguished from Framework: a
      publication *documents* a framework.
    examples: ["NIST.CSWP.29", "nist.ai.100-1"]
    irreducible: false
    fields:
      # published/released/draft/version 6.0%, 13 documents; TLP markings 1.6%, 3.
      - { key: datePublished, desc: "publication or release date, as stated" }
      - { key: version,       desc: "version, revision or draft stage, as stated" }
      - { key: marking,       desc: "distribution marking such as TLP:CLEAR, as stated" }

  - name: Tactic
    evidence: 12.9
    # tactic/reconnaissance/initial access/exfiltration..., 10 documents.
    description: >-
      An adversary goal in a tactics-and-techniques framework (the "why" that a
      technique serves).
    examples: ["Reconnaissance", "Initial Access", "Exfiltration", "ML Attack Staging"]

  - name: Person
    evidence: 1.9
    # named authors and officials, 6 documents. test-set: q13 (NIST AI 100-2's authors).
    description: A named author, official or researcher.
    examples: ["Apostol Vassilev", "Alina Oprea", "Hyrum Anderson"]

relation_types:
  # ── Framework structure ───────────────────────────────────────────────────
  - name: part_of
    domain: [Function, Control]
    range:  [Framework, Function]
    transitive: true
    acyclic: true
  - name: recommends
    domain: [Framework, Publication]
    range:  [Control]
  - name: published_by
    domain: [Publication, Framework]
    range:  [Organization]
    functional: true
  - name: supersedes
    domain: [Publication, Framework]
    range:  [Publication, Framework]
    acyclic: true
    inverse: superseded_by
  - name: references
    domain: [Publication]
    range:  [Publication]
    acyclic: true

  # ── Risk model — the predicates the global vocabulary entirely lacks ──────
  - name: mitigates
    description: A mitigation reduces a risk or defeats an attack technique.
    domain: [Mitigation, Control]
    range:  [Risk, AttackTechnique]
    inverse: mitigated_by
  - name: targets
    description: An attack technique is aimed at a system or asset.
    domain: [AttackTechnique]
    range:  [AISystem, Asset]
  - name: exploits
    domain: [AttackTechnique]
    range:  [Asset, AISystem]
  - name: poses_risk_to
    domain: [Risk, AttackTechnique]
    range:  [AISystem, Asset, Organization]
  - name: applies_to
    domain: [Control, Framework]
    range:  [AISystem, Organization, Asset]
  - name: detects
    description: >-
      Weaker than `mitigates` — detection without remediation. Kept separate
      because conflating them is how a control taxonomy loses its meaning.
    domain: [Mitigation]
    range:  [AttackTechnique]
  - name: governs
    domain: [Function]
    range:  [Risk]
  - name: conducted
    description: A threat actor carried out an attack technique. incident-report only.
    domain: [ThreatActor]
    range:  [AttackTechnique]
  - name: compromised
    domain: [ThreatActor]
    range:  [Asset, AISystem, Organization]

  # ── v2 ────────────────────────────────────────────────────────────────────
  - name: authored
    domain: [Person, Organization]
    range:  [Publication]
    inverse: authored_by
    triggers: ["authors", "co-authored", "prepared by"]
    aliases: [co_authored, wrote]
    # 1.0%, 8 documents. Not functional, unlike `published_by`. test-set: q01 (five
    # co-authoring agencies) and q13.
  - name: achieves
    description: A technique serves an adversary tactic.
    domain: [AttackTechnique]
    range:  [Tactic]
    # ATT&CK's own convention; q12 and q20.
  - name: derived_from
    description: A framework or publication is modeled on, based on, or adapted from another.
    domain: [Framework, Publication]
    range:  [Framework, Publication]
    triggers: ["modeled after", "based on", "adapted from", "derived from"]
    aliases: [modeled_after, based_on, adapted_from]
    acyclic: true
    # 6.8%, 13 documents ("ATLAS is modeled after ATT&CK").
  - name: profile_of
    description: A profile specialises a base framework for one technology or community.
    domain: [Publication, Framework]
    range:  [Framework]
    triggers: ["profile", "community profile"]
    # 2.4%, 12 documents; q15, q18 and q19 (600-1 is a profile of AI RMF;
    # 800-218A of SSDF).

axioms:
  - kind: contradiction
    pairs:
      - [mitigates, exploits]
  - kind: acyclic
    relations: [supersedes, references, part_of, derived_from]
  - kind: functional
    relations: [published_by]

# A standards corpus that admits a vague predicate stops being a standard.
fallback_predicate: null

rejected_types:
  - { name: genealogy (module), evidence: 0.0, reason: "no kinship words in 3,486 prose chunks" }

