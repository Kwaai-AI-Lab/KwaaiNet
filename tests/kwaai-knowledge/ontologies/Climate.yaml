ontology:
  name: climate
  version: 1
  extends: scholarly

provenance:
  derivation: derived
  note: >-
    6 sampled chunks (National Academies, CMIP6, Kroeker, Armstrong McKay)

entity_types:
  - name: Forcing
    description: A named radiative driver of climate change.
    examples: ["well-mixed greenhouse gases", "aerosols", "solar and volcanic drivers"]
    irreducible: false
  - name: TippingElement
    description: A subsystem with a threshold beyond which change is self-sustaining.
    examples: ["AMOC", "Boreal forest", "extra-polar glaciers"]
    irreducible: false
