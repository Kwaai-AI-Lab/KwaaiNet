# Ontology for the Astrophysics KB.
# Arm B, foundation-model authored 2026-08-25.
#
# IMPORTANT: sampling showed this KB is TWO corpora, not one — NASA spaceflight
# programme history (Apollo Spacecraft Vol IV, Apollo 13 Mission Review) and
# observational cosmology (Planck 2018 Results VI). They share almost no
# vocabulary. This file uses the `streams:` mechanism from PerKBOntology-plan
# §2.1 and is the first concrete instance of the parent doc's open question
# "does a KB have one ontology or several?" — the answer here is plainly several.
#
# 94.2% clean, 23 relations from 6437 entities — vocabulary-bound.
#
# v2, 2026-09-28. v1 was drawn from 3 chunks of 3 documents; the KB has 11. It
# also covers exoplanet detection (Wright and Gaudi), the EHT M87 image, dark-matter
# evidence (Roos), JWST's first images, the Voyager Golden Record and Launius's
# retrospective. Its questions treat documents as actors ("According to Ertel's
# ...", "What does the Apollo 204 Review Board report investigate?"). Every
# addition below carries its measured share of the 4,903 prose chunks, and
# test-set-driven additions are marked "test-set". Three source documents are
# missing from the KB: the Space Act, SPD-1 and the LIGO paper. Their nuggets are
# unreachable whatever the ontology says.

ontology:
  name: spaceflight-and-cosmology
  version: 2
  extends: none

provenance:
  derivation: derived
  note: >-
    v1: 3 sampled chunks. v2 (2026-09-28): full-corpus probes over 4,903 prose
    chunks, the pilot's judged edges, and the 20 questions with their gold nuggets.

streams:
  - name: mission-history
    entity_types: [Mission, Spacecraft, LaunchVehicle, Facility, Contractor,
                   Person, Milestone, Anomaly, Document, Legislation, Organization]
  - name: cosmology
    entity_types: [CosmologicalParameter, Observation, Instrument, Dataset,
                   Model, Constraint, Survey]
  # v2: exoplanets, black holes, dark matter and the Golden Record fit neither
  # stream above.
  - name: astrophysics
    entity_types: [AstronomicalObject, Phenomenon, Method, Instrument, Observation,
                   Survey, Artefact, Document, Person, Organization]

entity_types:
  # ── mission-history ───────────────────────────────────────────────────────
  - name: Mission
    description: A named crewed or uncrewed spaceflight.
    examples: ["Apollo 7", "Apollo 13"]
    # closed vocabulary: the probe terms its evidence share was measured with (2026-09-28)
    markers:
      exact: [apollo 1, apollo 7, apollo 8, apollo 11, apollo 13, apollo 204, apollo-soyuz, skylab, gemini, voyager 1, voyager 2]
    irreducible: false
  - name: Spacecraft
    description: A named vehicle or module.
    examples: ["Apollo Spacecraft", "Lunar Module"]
    irreducible: false
  - name: LaunchVehicle
    description: A named booster.
    examples: ["Saturn IB", "Saturn V"]
    irreducible: false
  - name: Facility
    description: A named centre, site, or launch complex.
    examples: ["Kennedy Space Center"]
    irreducible: false
  - name: Contractor
    description: An industrial contractor or supplier organisation.
    examples: ["North American Rockwell"]
    irreducible: false
  - name: Person
    description: A named individual — astronaut, engineer, administrator.
    irreducible: false
  - name: Organization
    description: >-
      A named agency, board, review panel or institution. Declared because
      `investigated_by.range` referenced it and nothing defined it.
    examples: ["NASA", "the Apollo 204 Review Board"]
    irreducible: false
  - name: Milestone
    description: >-
      A dated programme event: a launch, a report submission, a team stand-down.
    irreducible: false
    fields:
      - { key: date, desc: "date of the milestone as stated in the text" }
  - name: Anomaly
    description: >-
      A named failure, malfunction, or investigated incident. Distinct from
      Milestone because mission-review corpora are largely *about* these.
    examples: ["Teflon wire insulation damage", "tank electrical initiation"]
    irreducible: false

  # ── documents and policy (v2) ─────────────────────────────────────────────
  - name: Document
    schema_type: CreativeWork
    evidence: 18.9
    # report/history/paper/volume/review, all 11 documents. The questions ask
    # what each document covers, investigates or argues.
    description: >-
      A named report, history, paper, review or transcript: one of the corpus's
      own documents, or one they cite by name.
    examples: ["The Apollo Spacecraft Volume IV", "Apollo 204 Review Board Final Report",
               "Planck 2018 Results VI", "Apollo: A Retrospective Analysis"]
    fields:
      - { key: dateCreated, desc: "publication date, as stated" }
  - name: Legislation
    schema_type: Legislation
    evidence: 1.7
    # Act/Directive, 5 documents. test-set: q12, q13 and q16 (the Act's and SPD-1's
    # own documents are missing from the KB).
    description: A named law or policy directive.
    examples: ["National Aeronautics and Space Act of 1958", "Space Policy Directive 1"]
    irreducible: true
  - name: Artefact
    evidence: 2.7
    # record/plaque/greetings, 8 documents. test-set: q01 and q02.
    description: A named physical object made and carried for its own sake.
    examples: ["Voyager Golden Record", "Pioneer plaque"]

  # ── astrophysics (v2) ─────────────────────────────────────────────────────
  - name: AstronomicalObject
    evidence: 14.5
    # galaxy/black hole/star/planet/cluster, 10 documents.
    description: A named or designated celestial object or system.
    examples: ["M87", "Coma cluster", "Milky Way", "GW150914"]
    # closed vocabulary: the probe terms its evidence share was measured with (2026-09-28)
    markers:
      exact: [galaxy, galaxies, black hole, black holes, supermassive black hole, exoplanet, exoplanets, star cluster, galaxy cluster, quasar, supernova, nebula, milky way, m87, coma cluster]
  - name: Phenomenon
    evidence: 8.7
    # gravitational waves/dark matter/CMB/rotation curves/event horizon, 6 documents.
    description: A physical phenomenon the documents observe or explain.
    examples: ["dark matter", "gravitational waves", "cosmic microwave background anisotropies",
               "black hole shadow"]
    # closed vocabulary: the probe terms its evidence share was measured with (2026-09-28)
    markers:
      exact: [gravitational waves, gravitational wave, dark matter, dark energy, cosmic microwave background, cmb anisotropies, rotation curves, rotation curve, event horizon, black hole shadow, gravitational lensing, redshift]
  - name: Method
    evidence: 4.9
    # radial velocity/transit/microlensing/astrometry/direct imaging, 6 documents.
    description: A named observational or detection technique.
    examples: ["radial velocity", "transit photometry", "gravitational microlensing",
               "very-long-baseline interferometry"]
    # closed vocabulary: the probe terms its evidence share was measured with (2026-09-28)
    markers:
      exact: [radial velocity, transit photometry, transit method, gravitational microlensing, microlensing, astrometry, direct imaging, interferometry, very-long-baseline interferometry, spectroscopy]

  # ── cosmology ─────────────────────────────────────────────────────────────
  - name: CosmologicalParameter
    description: A measurable parameter of a cosmological model.
    examples: ["Omega_EFT_0", "H0"]
    irreducible: false
    fields:
      - { key: units, desc: "units, where the text gives them" }
  - name: Observation
    description: A named observational result or likelihood.
    examples: ["Planck TT,TE,EE+lowE+lensing", "CMB lensing"]
    irreducible: false
  - name: Instrument
    description: A named telescope, detector, or observing platform.
    examples: ["Planck"]
    # closed vocabulary: the probe terms its evidence share was measured with (2026-09-28)
    markers:
      exact: [james webb space telescope, jwst, hubble space telescope, planck, ligo, virgo, event horizon telescope, kepler]
    irreducible: false
  - name: Dataset
    description: A named data product or external dataset combination.
    examples: ["BAO/RSD+WL"]
    irreducible: false
  - name: Model
    description: A named cosmological or physical model.
    irreducible: false
  - name: Constraint
    description: >-
      A stated numeric bound or shift with a significance.
    # Numbers and sigmas must not be paraphrased.
    irreducible: true
    fields:
      - { key: value,        desc: "the numeric constraint as stated" }
      - { key: significance, desc: "sigma or confidence level" }
  - name: Survey
    description: A named observing programme or collaboration.
    examples: ["Planck Collaboration"]
    irreducible: false

relation_types:
  # ── mission-history ───────────────────────────────────────────────────────
  - name: launched_from
    domain: [Mission]
    range:  [Facility]
  - name: launched_on
    domain: [Mission]
    range:  [LaunchVehicle]
  - name: carried
    domain: [Mission, Spacecraft]
    range:  [Spacecraft, Artefact]   # v2: Voyager carried the Golden Record
  - name: built_by
    domain: [Spacecraft, LaunchVehicle]
    range:  [Contractor]
  - name: occurred_during
    domain: [Milestone, Anomaly]
    range:  [Mission]
  - name: caused_by
    description: An anomaly attributed to a named cause.
    domain: [Anomaly]
    range:  [Anomaly, Spacecraft, Person]
  - name: investigated_by
    domain: [Anomaly]
    range:  [Organization, Person, Document]   # v2: a review board's report investigates too
    triggers: ["investigation of", "investigated", "review of"]
    # investigated/review 8.7%, 8 documents.
  - name: located_at
    domain: [Anomaly, Milestone]
    range:  [Facility]
    # "the fire occurred at Launch Complex 34" (q07).
  - name: died_in
    domain: [Person]
    range:  [Anomaly]
    triggers: ["died", "killed", "lost their lives"]
    # 0.3%, 3 documents. test-set: q07 (the Apollo 1 crew).

  # ── documents and policy (v2) ─────────────────────────────────────────────
  - name: authored
    domain: [Person, Organization, Survey]
    range:  [Document]
    inverse: authored_by
    triggers: ["written by", "authored"]
    aliases: [wrote]
    # 0.6%, 7 documents. test-set: q03, q06, q09 and q14 name authors.
  - name: covers
    description: A document's subject.
    domain: [Document]
    range:  [Mission, Anomaly, Milestone, Observation, Phenomenon, AstronomicalObject,
             Method, Spacecraft, Artefact]
    triggers: ["documents", "chronicles", "covers", "describes", "summarizes"]
    aliases: [documents, describes, chronicles]
    # 1.9%, 10 documents.
  - name: established
    domain: [Legislation, Organization]
    range:  [Organization, Facility, Mission]
    triggers: ["established", "created", "founded"]
    # 4.5%, 8 documents (the Space Act established NASA, q12).
  - name: directs
    domain: [Legislation]
    range:  [Organization]
    # test-set: q13 (SPD-1 directs NASA).

  # ── astrophysics (v2) ─────────────────────────────────────────────────────
  - name: observed
    domain: [Instrument, Survey, Mission, Observation]
    range:  [AstronomicalObject, Phenomenon]
    triggers: ["detected", "observed", "imaged"]
    aliases: [detected, imaged]
    # detected/observed/imaged 7.8%, 9 documents.
  - name: detects
    domain: [Method]
    range:  [AstronomicalObject, Phenomenon]
    # "radial velocity detects exoplanets" (q14).
  - name: evidence_for
    domain: [Observation, Phenomenon, AstronomicalObject, Dataset]
    range:  [Phenomenon, Model, CosmologicalParameter]
    triggers: ["evidence for", "evidence of", "consistent with"]
    # 4.4%, 9 documents; q09 and q18 (lines of evidence for dark matter).

  # ── cosmology ─────────────────────────────────────────────────────────────
  - name: constrains
    description: An observation places a bound on a parameter.
    domain: [Observation, Dataset]
    range:  [CosmologicalParameter]
    inverse: constrained_by
  - name: measured_by
    domain: [CosmologicalParameter]
    range:  [Instrument, Observation]
  - name: produced_by
    domain: [Dataset, Observation]
    range:  [Instrument, Survey]
  - name: assumes
    domain: [Constraint]
    range:  [Model]
  - name: reports
    domain: [Survey]
    range:  [Constraint]
  - name: tension_with
    description: >-
      Two constraints in statistical disagreement. Symmetric, and the predicate
      cosmology arguments are actually about.
    domain: [Constraint]
    range:  [Constraint]
    symmetric: true

axioms:
  - kind: acyclic
    relations: [caused_by]
  - kind: contradiction
    pairs:
      - [constrains, tension_with]

fallback_predicate: null

rejected_types:
  - { name: genealogy (module), evidence: 0.4, reason: "kinship words in 22 of 4,903 prose chunks" }

