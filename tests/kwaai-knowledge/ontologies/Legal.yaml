# Ontology for the Legal KB — US Supreme Court jurisprudence.
# Arm B, foundation-model authored 2026-08-25, grounded in sampled corpus text
# (Dred Scott, Lochner, Miranda, Jacobson). Format: PerKBOntology-plan.md §2.1.
#
# Why this KB first: 96.9% clean text and 2 relations from 2955 entities. It is
# the clearest genuinely vocabulary-bound corpus we have — nothing here is
# blocked on ingestion, so a better vocabulary is the only variable.
#
# v2, 2026-09-28. Completed after the ontology pilot, where Legal was the one
# corpus on which the ontology produced fewer correct relations than the compiled
# defaults. v1 was drawn from 4 sampled chunks and modelled only case law. The
# defaults arm's correct edges were legislative and political ("Congress passed
# the Missouri Compromise", "BCRA amends FECA", "General DeWitt issued the
# Proclamation", "John Randolph member of the House"), and v1 could express none
# of them. Every addition below carries its measured share of the 3,655 prose
# chunks. Its sources were the pilot's judged edges, the 20 questions and their
# gold nuggets, and full-corpus probes. Additions that exist mainly for the test
# set are marked "test-set".

ontology:
  name: us-case-law
  version: 2
  extends: none

provenance:
  derivation: derived
  note: >-
    v1: 4 sampled chunks. v2 (2026-09-28): full-corpus probes over 3,655 prose
    chunks, the pilot's judged edges, and the 20 questions with their gold nuggets.

entity_types:
  - name: Case
    description: >-
      A named judicial decision, cited in the form "X v. Y, 198 U.S. 45 (1905)".
      The unit of precedent.
    examples: ["Lochner v. New York", "Dred Scott v. Sandford", "Miranda v. Arizona"]
    anti_examples:
      - "Fifth Amendment"      # a ConstitutionalProvision
      - "police powers"        # a Doctrine
    irreducible: false
    fields:
      - { key: citation,    desc: "reporter citation, e.g. 198 U.S. 45" }
      - { key: dateDecided, desc: "year the case was decided" }

  - name: Court
    description: A judicial body that decides cases.
    examples: ["Supreme Court of the United States", "Circuit Court"]
    irreducible: false

  - name: Justice
    description: >-
      A named judge authoring or joining an opinion. A Person in a specific
      judicial role — kept distinct from Party so opinions attach correctly.
    examples: ["Chief Justice Taney", "Justice Peckham"]
    irreducible: false

  # v2: `Party` is gone. Being a party is a role, expressed by `party_to`. As a
  # type it forced "Citizens United" to be a Party in one chunk and an
  # Organization in the next, and since the type is part of the entity-id hash,
  # one litigant became two entities.
  - name: Person
    evidence: 4.3
    # titled non-judicial people ("General DeWitt", "Senator ..."), 12 of 13
    # documents; litigants such as Dred Scott and Miranda add more.
    description: >-
      A named individual who is not acting as a Justice: litigants, legislators,
      officials, officers, historical figures.
    examples: ["Dred Scott", "Ernesto Miranda", "John L. DeWitt", "John Randolph"]
    anti_examples: ["Chief Justice Taney"]   # a Justice

  - name: Organization
    evidence: 9.1
    # corporation/union/association/party/committee, 12 documents.
    description: >-
      A named corporation, union, association, party, agency or other body that is
      not a court or a legislature.
    examples: ["Citizens United", "Federal Election Commission", "Board of Education of Topeka"]

  - name: Legislature
    evidence: 20.8
    # Congress/House/Senate/legislature, all 13 documents. v1 had no type for
    # the body that enacts the statutes the cases turn on.
    description: A named law-making body.
    examples: ["Congress", "House of Representatives", "Senate", "New York legislature"]

  - name: ExecutiveOrder
    evidence: 1.7
    # executive/military/exclusion orders and proclamations, 3 documents.
    # test-set: q09's nuggets turn on Civilian Exclusion Order No. 34.
    description: A named executive or military order or proclamation.
    examples: ["Civilian Exclusion Order No. 34", "Public Proclamation No. 3"]
    irreducible: true

  - name: HistoricalEvent
    evidence: 4.6
    # war/depression/convention, 8 documents; the context q08 and q10 ask about.
    description: A named event the opinions treat as context for a decision.
    examples: ["Civil War", "Great Depression", "Federal Convention"]

  - name: Opinion
    description: >-
      A majority, concurring, or dissenting opinion within a case.
    irreducible: false
    fields:
      - { key: opinionType, desc: "majority | concurrence | dissent | per curiam" }

  - name: ConstitutionalProvision
    description: >-
      A named clause, article, or amendment of the Constitution.
    examples: ["Fifth Amendment", "Fourteenth Amendment", "Commerce Clause"]
    # Constitutional text must survive verbatim — paraphrase changes the law.
    irreducible: true

  - name: Statute
    description: >-
      An enacted law, act of Congress, ordinance, or state statute.
    examples: ["Missouri Compromise", "Ordinance of 1787"]
    irreducible: true

  - name: Doctrine
    description: >-
      A named legal principle or test that cases establish, apply, or reject.
    examples: ["police powers", "liberty of contract", "substantive due process"]
    irreducible: false

  - name: Holding
    description: >-
      The rule of law a case establishes — the operative proposition, as
      distinct from dicta.
    # The exact words of a holding are what later courts are bound by.
    irreducible: true

  - name: Jurisdiction
    description: A geographic or political domain of legal authority.
    examples: ["Missouri", "the several States", "federal territory"]
    irreducible: false

relation_types:
  # ── Case structure ────────────────────────────────────────────────────────
  - name: decided_by
    description: A case was decided by a court.
    domain: [Case]
    range:  [Court]
    functional: true          # a case has exactly one deciding court
  - name: party_to
    domain: [Person, Organization, Jurisdiction]   # a State is a party too
    range:  [Case]
  - name: authored_opinion
    domain: [Justice]
    range:  [Opinion]
    inverse: opinion_authored_by
  - name: opinion_in
    domain: [Opinion]
    range:  [Case]
  - name: dissents_from
    description: A justice's opinion dissenting from the majority in a case.
    domain: [Justice]
    range:  [Case]
  - name: joins
    description: A justice joins an opinion.
    domain: [Justice]
    range:  [Opinion]
    triggers: ["joined", "joins in the opinion", "concurring"]
    aliases: [joined, concurs_in]
    # joined/concurring 2.8%, 11 documents.
  - name: holds
    domain: [Case]
    range:  [Holding]

  # ── Precedent — the predicates the memoir vocabulary has no analogue for ──
  - name: cites
    domain: [Case, Opinion]
    range:  [Case, Statute, ConstitutionalProvision]
    acyclic: true             # a case cannot cite a later case
  - name: overrules
    description: A later case abrogates an earlier one's holding.
    domain: [Case]
    range:  [Case]
    acyclic: true
    inverse: overruled_by
  - name: distinguishes
    description: >-
      A case declines to apply an earlier one by finding material difference —
      not the same as overruling, and the distinction matters.
    domain: [Case]
    range:  [Case]
    acyclic: true
  - name: affirms
    domain: [Case]
    range:  [Case]
    acyclic: true
  - name: reverses
    domain: [Case]
    range:  [Case]
    acyclic: true

  # ── Interpretation ────────────────────────────────────────────────────────
  - name: interprets
    domain: [Case, Opinion]
    range:  [ConstitutionalProvision, Statute]
  - name: strikes_down
    description: A case holds a statute unconstitutional.
    domain: [Case]
    range:  [Statute, ExecutiveOrder]
  - name: upholds
    description: A case sustains a statute or order against challenge.
    domain: [Case]
    range:  [Statute, ExecutiveOrder]
    triggers: ["upheld", "upholding", "sustained"]
    aliases: [upheld, sustains, sustained]
    # upheld/upholding/sustained 4.2%, all 13 documents. v1's `affirms` covers
    # only lower-court judgments; q09 and q11 ask what Korematsu and McConnell
    # upheld.
  - name: establishes
    domain: [Case]
    range:  [Doctrine]
  - name: applies
    domain: [Case]
    range:  [Doctrine]
  - name: enacted_in
    domain: [Statute]
    range:  [Jurisdiction]

  # ── Legislation and executive action (v2) ─────────────────────────────────
  - name: enacted_by
    domain: [Statute]
    range:  [Legislature]
    inverse: enacted
    triggers: ["passed", "enacted by", "adopted by"]
    aliases: [passed_by]
    # passed/enacted 6.3%, 12 documents ("Congress passed the Missouri Compromise").
  - name: amends
    domain: [Statute]
    range:  [Statute]
    triggers: ["amends", "amended", "amending"]
    acyclic: true
    # 1.2%, 8 documents ("BCRA amends FECA").
  - name: repeals
    domain: [Statute]
    range:  [Statute]
    triggers: ["repealed", "repeals"]
    aliases: [supersedes]
    acyclic: true
    # 0.8%, 7 documents.
  - name: nullifies
    description: A constitutional amendment or later statute nullifies a decision.
    domain: [ConstitutionalProvision, Statute]
    range:  [Case]
    triggers: ["nullified", "abrogated", "superseded"]
    aliases: [abrogates]
    # 0.8%, 5 documents. test-set: q17 (the 13th and 14th Amendments nullified
    # Dred Scott).
  - name: issued
    domain: [Person, Organization]
    range:  [ExecutiveOrder]
    inverse: issued_by
    triggers: ["issued", "promulgated"]
    # 1.1%, 6 documents ("General DeWitt issued the Proclamation").
  - name: member_of
    domain: [Person]
    range:  [Legislature, Organization]
    triggers: ["member of", "served in", "representative from"]
    # 0.5%, 3 documents: low, but the defaults arm's correct edges included it.
  - name: has_jurisdiction_over
    domain: [Court]
    range:  [Jurisdiction]

axioms:
  # A case cannot both affirm and reverse the same case, nor overrule what it
  # affirms. These are the legal analogue of the kinship contradiction table.
  - kind: contradiction
    pairs:
      - [affirms, reverses]
      - [affirms, overrules]
      - [overrules, distinguishes]
  - kind: functional
    relations: [decided_by]
  - kind: acyclic
    relations: [cites, overrules, affirms, reverses, distinguishes, amends, repeals]
  - kind: contradiction
    pairs:
      - [upholds, strikes_down]

# The document types this ontology serves (ontology selection narrows to it for these).
document_types: [CourtOpinion]

# No fallback predicate. `associated_with` between two cases asserts nothing a
# lawyer would accept, and admitting it is how the current graphs became noise.
fallback_predicate: null

# ── Rejected, with their numbers (v2) ────────────────────────────────────────
rejected_types:
  - { name: genealogy (module), evidence: 4.5, reason: "Kinship words are in 4.5% of prose chunks. Dred Scott's family (Harriet his wife; Eliza and Lizzie his children) supplies 83 of them, and those are real facts. Roe's 'mother' means the pregnant woman, which is not kinship. No question asks about the Scott family, so 14 predicates would be offered to every chunk for one document's facts. Reza may override" }
  - { name: regulates, evidence: 9.5, reason: "prohibit/restrict/ban language in 13 documents, but what is regulated (bakers' hours, soft money, abortion) is an activity, and the ontology has no activity type. The nuggets express it as a statute's description, not as an edge" }
  - { name: Party, reason: "v1 type; a role (`party_to`), not a type. See Person" }

